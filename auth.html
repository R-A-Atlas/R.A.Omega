<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R.A. Omega - Sign In</title>
    <link rel="stylesheet" href="/design_system.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        /* Brand accent: #18C6C8 — ATLAS cyan (defined as --color-accent in design_system.css) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--color-bg);
            color: var(--color-text-secondary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
            background-image: radial-gradient(circle at 50% -10%, rgba(24,198,200,0.08) 0%, transparent 55%);
        }
        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border-solid);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        .brand {
            text-align: center;
            margin-bottom: var(--space-6);
        }
        .brand-name {
            font-size: var(--text-xl);
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--color-accent);
            font-family: var(--font-sans);
        }
        .brand-sub {
            font-size: var(--text-xs);
            color: var(--color-text-faint);
            margin-top: var(--space-1);
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--color-border-solid);
            margin-bottom: var(--space-6);
        }
        .tab {
            flex: 1;
            padding: var(--space-2) var(--space-3);
            text-align: center;
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--color-text-faint);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: var(--font-sans);
            transition: color var(--anim-fast) var(--ease-out),
                        border-color var(--anim-fast) var(--ease-out);
        }
        .tab:hover { color: var(--color-text-muted); }
        .tab.active {
            color: var(--color-text);
            border-bottom-color: var(--color-accent);
        }
        .field { margin-bottom: var(--space-4); }
        label {
            display: block;
            font-size: var(--text-xs);
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--color-text-faint);
            margin-bottom: var(--space-1);
        }
        input {
            width: 100%;
            background: var(--color-bg);
            border: 1px solid var(--color-border-solid);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-3);
            color: var(--color-text);
            font-size: var(--text-sm);
            font-family: inherit;
            outline: none;
            transition: border-color var(--anim-fast) var(--ease-out),
                        box-shadow var(--anim-fast) var(--ease-out);
        }
        input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 2px var(--color-accent-dim);
        }
        .btn {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: var(--color-accent);
            color: #000;
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: 700;
            font-family: var(--font-sans);
            cursor: pointer;
            margin-top: var(--space-2);
            transition: opacity var(--anim-fast) var(--ease-out);
            letter-spacing: 0.02em;
        }
        .btn:hover { opacity: 0.88; }
        .btn:disabled {
            background: var(--color-surface-hover);
            color: var(--color-text-faint);
            cursor: not-allowed;
            opacity: 1;
        }
        .error {
            background: var(--color-coral-dim);
            border: 1px solid var(--color-coral);
            color: var(--color-coral);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-3);
            font-size: var(--text-xs);
            margin-bottom: var(--space-4);
            display: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="brand-name">R.A. OMEGA_</div>
            <div class="brand-sub">AI Finance Model</div>
        </div>

        <div class="tabs">
            <button class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <div id="error-msg" class="error"></div>

        <div id="panel-signin">
            <div class="field">
                <label for="si-email">Email</label>
                <input id="si-email" type="email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="field">
                <label for="si-password">Password</label>
                <input id="si-password" type="password" placeholder="Password" autocomplete="current-password" />
            </div>
            <button class="btn" id="btn-signin" onclick="signIn()">Sign In</button>
        </div>

        <div id="panel-signup" class="hidden">
            <div class="field">
                <label for="su-email">Email</label>
                <input id="su-email" type="email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="field">
                <label for="su-password">Password</label>
                <input id="su-password" type="password" placeholder="Password" autocomplete="new-password" />
            </div>
            <div class="field">
                <label for="su-confirm">Confirm Password</label>
                <input id="su-confirm" type="password" placeholder="Confirm password" autocomplete="new-password" />
            </div>
            <button class="btn" id="btn-signup" onclick="signUp()">Create Account</button>
        </div>
    </div>

    <script>
        const cfg = window.__ATLAS_SB_CONFIG__ || {};
        const sb = (cfg.url && cfg.anonKey)
            ? supabase.createClient(cfg.url, cfg.anonKey)
            : null;

        function switchTab(tab) {
            const isSignin = tab === 'signin';
            document.getElementById('tab-signin').classList.toggle('active', isSignin);
            document.getElementById('tab-signup').classList.toggle('active', !isSignin);
            document.getElementById('panel-signin').classList.toggle('hidden', !isSignin);
            document.getElementById('panel-signup').classList.toggle('hidden', isSignin);
            clearError();
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearError() {
            const el = document.getElementById('error-msg');
            el.style.display = 'none';
            el.textContent = '';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.textContent = loading
                ? 'Please wait...'
                : (btnId === 'btn-signin' ? 'Sign In' : 'Create Account');
        }

        async function signIn() {
            clearError();
            if (!sb) { showError('Auth not configured - missing Supabase keys.'); return; }
            const email = document.getElementById('si-email').value.trim();
            const password = document.getElementById('si-password').value;
            if (!email || !password) { showError('Email and password are required.'); return; }
            setLoading('btn-signin', true);
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            setLoading('btn-signin', false);
            if (error) { showError(error.message); return; }
            localStorage.setItem('atlas_access_token', data.session.access_token);
            window.location.href = '/option1';
        }

        async function signUp() {
            clearError();
            if (!sb) { showError('Auth not configured - missing Supabase keys.'); return; }
            const email = document.getElementById('su-email').value.trim();
            const password = document.getElementById('su-password').value;
            const confirm = document.getElementById('su-confirm').value;
            if (!email || !password) { showError('Email and password are required.'); return; }
            if (password !== confirm) { showError('Passwords do not match.'); return; }
            if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
            setLoading('btn-signup', true);
            const { data, error } = await sb.auth.signUp({ email, password });
            setLoading('btn-signup', false);
            if (error) { showError(error.message); return; }
            if (data.session) {
                localStorage.setItem('atlas_access_token', data.session.access_token);
                window.location.href = '/option1';
            } else {
                showError('Check your email for a confirmation link, then sign in.');
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            const isSignin = !document.getElementById('panel-signin').classList.contains('hidden');
            if (isSignin) signIn(); else signUp();
        });
    </script>
</body>
</html>
