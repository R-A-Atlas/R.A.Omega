<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS — Institutional Financial Intelligence</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cobalt: #0044FF;
            --cerulean: #00AFFF;
            --void: #020203;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            overflow: hidden;
            background-color: var(--void);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
            width: 100vw;
            height: 100vh;
        }

        .font-cinematic {
            font-family: 'Syncopate', sans-serif;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, transparent 20%, #020203 100%);
            z-index: 1;
            pointer-events: none;
        }

        .ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .interactive { pointer-events: auto; }

        /* Auth card */
        .auth-card {
            background: rgba(10, 12, 18, 0.90);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 14px;
            padding: 2rem;
            width: 320px;
        }

        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 7px;
            padding: 0.58rem 0.8rem;
            color: #fff;
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .auth-input:focus { border-color: #0044FF; }
        .auth-input::placeholder { color: rgba(255,255,255,0.25); }

        .auth-btn {
            width: 100%;
            padding: 0.65rem;
            background: #0044FF;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 1.1rem;
            transition: background 0.15s, opacity 0.15s;
        }
        .auth-btn:hover { background: #1a5fff; }
        .auth-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .auth-tab {
            flex: 1;
            padding: 0.45rem;
            font-size: 0.78rem;
            font-weight: 500;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.15s, border-color 0.15s;
        }

        .auth-error {
            background: rgba(255, 60, 60, 0.12);
            border: 1px solid rgba(255, 60, 60, 0.28);
            color: #FF7B72;
            border-radius: 6px;
            padding: 0.5rem 0.7rem;
            font-size: 0.75rem;
            margin-bottom: 0.875rem;
        }

        /* Feature pills */
        .feature-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 100px;
            padding: 0.3rem 0.75rem;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
        }

        .feature-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--cerulean);
            flex-shrink: 0;
        }

        /* Status bar top */
        .status-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.3);
        }
        .status-value {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.7);
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zenith: { cobalt: '#0044FF', cerulean: '#00AFFF', void: '#020203' }
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        /* ─── 3D Wave Background ─── */
        const TopologicalOcean = () => {
            const mountRef = useRef(null);

            useEffect(() => {
                if (!mountRef.current) return;

                const scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x020203, 0.015);

                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
                camera.position.set(0, 40, 80);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                mountRef.current.appendChild(renderer.domElement);

                const SEGS = 150;
                const SIZE = 200;
                const geometry = new THREE.PlaneGeometry(SIZE, SIZE, SEGS, SEGS);
                geometry.rotateX(-Math.PI / 2);

                const count = geometry.attributes.position.count;
                const initialPositions = new Float32Array(count * 3);
                const posArray = geometry.attributes.position.array;
                for (let i = 0; i < count * 3; i++) initialPositions[i] = posArray[i];

                const colors = new Float32Array(count * 3);
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.3, vertexColors: true, transparent: true,
                    opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
                });

                const particles = new THREE.Points(geometry, material);
                scene.add(particles);

                let targetRotX = 0, targetRotY = 0;
                const onMouseMove = (e) => {
                    targetRotX = (e.clientX / window.innerWidth - 0.5) * 0.2;
                    targetRotY = (e.clientY / window.innerHeight - 0.5) * 0.2;
                };
                window.addEventListener('mousemove', onMouseMove);

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', onResize);

                let reqId;
                const clock = new THREE.Clock();
                const colorWhite = new THREE.Color(0xffffff);
                const colorDark  = new THREE.Color(0x333333);
                const tempColor  = new THREE.Color();

                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    const time = clock.getElapsedTime();

                    camera.position.lerp(new THREE.Vector3(0, 40, 80), 0.02);
                    particles.rotation.y += (0 - particles.rotation.y) * 0.05;
                    particles.rotation.z += (targetRotX - particles.rotation.z) * 0.05;
                    particles.rotation.x += (targetRotY - particles.rotation.x) * 0.05;

                    const pos = geometry.attributes.position.array;
                    const col = geometry.attributes.color.array;
                    const speed = 0.5, height = 3, waveFreq = 0.05;

                    for (let i = 0; i < count; i++) {
                        const i3 = i * 3;
                        const x = initialPositions[i3], z = initialPositions[i3 + 2];
                        const y = (Math.sin(x * waveFreq + time * speed) +
                                   Math.cos(z * waveFreq + time * speed * 0.8) +
                                   Math.sin((x + z) * waveFreq * 0.5 - time * speed * 1.2)) * height;
                        pos[i3 + 1] = y;

                        let mix = (y + height * 3) / (height * 6);
                        mix = Math.max(0, Math.min(1, mix));
                        tempColor.lerpColors(colorDark, colorWhite, mix);
                        col[i3] = tempColor.r; col[i3+1] = tempColor.g; col[i3+2] = tempColor.b;
                    }

                    geometry.attributes.position.needsUpdate = true;
                    geometry.attributes.color.needsUpdate = true;
                    renderer.render(scene, camera);
                };

                animate();

                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('resize', onResize);
                    cancelAnimationFrame(reqId);
                    if (mountRef.current && renderer.domElement.parentNode === mountRef.current) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    renderer.dispose();
                };
            }, []);

            return <div ref={mountRef} id="webgl-canvas" />;
        };

        /* ─── Auth Panel ─── */
        const AuthPanel = () => {
            const [tab, setTab]         = useState('signin');
            const [email, setEmail]     = useState('');
            const [password, setPass]   = useState('');
            const [confirm, setConfirm] = useState('');
            const [error, setError]     = useState('');
            const [loading, setLoading] = useState(false);
            const [success, setSuccess] = useState('');

            const sb = useMemo(() => {
                const cfg = window.__ATLAS_SB_CONFIG__ || {};
                return (cfg.url && cfg.anonKey && window.supabase)
                    ? window.supabase.createClient(cfg.url, cfg.anonKey)
                    : null;
            }, []);

            const switchTab = (t) => { setTab(t); setError(''); setSuccess(''); };

            const signIn = async () => {
                setError(''); setSuccess('');
                if (!sb)       { setError('Auth not configured.'); return; }
                if (!email || !password) { setError('Email and password required.'); return; }
                setLoading(true);
                const { data, error: err } = await sb.auth.signInWithPassword({ email, password });
                setLoading(false);
                if (err) { setError(err.message); return; }
                localStorage.setItem('atlas_access_token', data.session.access_token);
                window.location.href = '/option1';
            };

            const signUp = async () => {
                setError(''); setSuccess('');
                if (!sb)       { setError('Auth not configured.'); return; }
                if (!email || !password) { setError('Email and password required.'); return; }
                if (password !== confirm) { setError('Passwords do not match.'); return; }
                if (password.length < 6)  { setError('Password must be at least 6 characters.'); return; }
                setLoading(true);
                const { data, error: err } = await sb.auth.signUp({ email, password });
                setLoading(false);
                if (err) { setError(err.message); return; }
                if (data.session) {
                    localStorage.setItem('atlas_access_token', data.session.access_token);
                    window.location.href = '/option1';
                } else {
                    setSuccess('Check your email for a confirmation link, then sign in.');
                }
            };

            const onKey = (e) => { if (e.key === 'Enter') tab === 'signin' ? signIn() : signUp(); };

            return (
                <div className="auth-card interactive">
                    {/* Brand */}
                    <div style={{ marginBottom: '1.4rem' }}>
                        <div className="font-cinematic" style={{ fontSize: '1.15rem', fontWeight: 700, letterSpacing: '0.15em', color: '#0044FF' }}>
                            ATLAS<span style={{ color: '#00AFFF' }}>_</span>
                        </div>
                        <div style={{ fontSize: '0.65rem', color: 'rgba(255,255,255,0.3)', marginTop: '0.3rem', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                            Institutional Financial Intelligence
                        </div>
                    </div>

                    {/* Tabs */}
                    <div style={{ display: 'flex', borderBottom: '1px solid rgba(255,255,255,0.08)', marginBottom: '1.2rem' }}>
                        {[['signin','Sign In'],['signup','Create Account']].map(([t, label]) => (
                            <button key={t} className="auth-tab" onClick={() => switchTab(t)} style={{
                                color: tab === t ? '#fff' : 'rgba(255,255,255,0.35)',
                                borderBottomColor: tab === t ? '#0044FF' : 'transparent',
                            }}>{label}</button>
                        ))}
                    </div>

                    {/* Error */}
                    {error && <div className="auth-error">{error}</div>}

                    {/* Success */}
                    {success && (
                        <div style={{ background: 'rgba(0,175,255,0.08)', border: '1px solid rgba(0,175,255,0.2)', color: '#00AFFF', borderRadius: '6px', padding: '0.5rem 0.7rem', fontSize: '0.75rem', marginBottom: '0.875rem' }}>
                            {success}
                        </div>
                    )}

                    {/* Fields */}
                    <div style={{ marginBottom: '0.75rem' }}>
                        <label style={{ display: 'block', fontSize: '0.68rem', color: 'rgba(255,255,255,0.38)', marginBottom: '0.3rem', textTransform: 'uppercase', letterSpacing: '0.07em' }}>Email</label>
                        <input className="auth-input" type="email" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={onKey} placeholder="you@example.com" autoComplete="email" />
                    </div>

                    <div style={{ marginBottom: tab === 'signup' ? '0.75rem' : '0' }}>
                        <label style={{ display: 'block', fontSize: '0.68rem', color: 'rgba(255,255,255,0.38)', marginBottom: '0.3rem', textTransform: 'uppercase', letterSpacing: '0.07em' }}>Password</label>
                        <input className="auth-input" type="password" value={password} onChange={e => setPass(e.target.value)} onKeyDown={onKey} placeholder="••••••••" autoComplete={tab === 'signup' ? 'new-password' : 'current-password'} />
                    </div>

                    {tab === 'signup' && (
                        <div>
                            <label style={{ display: 'block', fontSize: '0.68rem', color: 'rgba(255,255,255,0.38)', marginBottom: '0.3rem', textTransform: 'uppercase', letterSpacing: '0.07em' }}>Confirm Password</label>
                            <input className="auth-input" type="password" value={confirm} onChange={e => setConfirm(e.target.value)} onKeyDown={onKey} placeholder="••••••••" autoComplete="new-password" />
                        </div>
                    )}

                    <button className="auth-btn" onClick={tab === 'signin' ? signIn : signUp} disabled={loading}>
                        {loading ? 'Please wait…' : (tab === 'signin' ? 'Sign In →' : 'Create Account →')}
                    </button>
                </div>
            );
        };

        /* ─── Root App ─── */
        const App = () => {
            const features = [
                '10-Loop Intelligence Engine',
                'Real-Time Data Synthesis',
                'Options & Equity Analysis',
                'Portfolio Personalization',
                'Institutional-Grade Reports',
            ];

            return (
                <div className="w-full h-full relative">
                    {/* 3D Background */}
                    <TopologicalOcean />
                    <div className="vignette" />

                    {/* UI Layer */}
                    <div className="ui-layer" style={{ padding: '2rem 2.5rem' }}>

                        {/* Top bar */}
                        <div className="flex justify-between items-start w-full">
                            <div>
                                <h1 className="font-cinematic" style={{ fontSize: '1.5rem', letterSpacing: '0.3em', fontWeight: 700, lineHeight: 1 }}>
                                    ATLAS<span style={{ color: '#0044FF' }}>_</span>
                                </h1>
                                <p style={{ color: 'rgba(255,255,255,0.3)', fontSize: '0.65rem', letterSpacing: '0.18em', textTransform: 'uppercase', marginTop: '0.5rem' }}>
                                    Zenith Topology • Active
                                </p>
                            </div>

                            {/* Status indicators — purely decorative */}
                            <div className="flex gap-6" style={{ fontSize: '0.62rem', textTransform: 'uppercase', letterSpacing: '0.12em' }}>
                                <div className="flex flex-col items-end gap-1">
                                    <span style={{ color: 'rgba(255,255,255,0.3)' }}>Engine</span>
                                    <span style={{ color: '#00AFFF' }}>ONLINE</span>
                                </div>
                                <div className="flex flex-col items-end gap-1">
                                    <span style={{ color: 'rgba(255,255,255,0.3)' }}>Data Sync</span>
                                    <span style={{ color: 'rgba(255,255,255,0.7)' }}>LIVE</span>
                                </div>
                            </div>
                        </div>

                        {/* Middle — Hero copy left, Auth card right */}
                        <div className="flex-1 flex items-center justify-between w-full" style={{ marginTop: '2rem', marginBottom: '2rem' }}>

                            {/* Left: Hero copy */}
                            <div className="interactive" style={{ maxWidth: '480px' }}>
                                <div style={{ fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.2em', color: '#00AFFF', marginBottom: '1rem' }}>
                                    Institutional-grade analysis
                                </div>
                                <h2 className="font-cinematic" style={{ fontSize: 'clamp(1.8rem, 3vw, 2.8rem)', fontWeight: 700, lineHeight: 1.1, letterSpacing: '-0.01em', marginBottom: '1.2rem' }}>
                                    FINANCIAL<br />
                                    INTELLIGENCE<br />
                                    <span style={{ color: '#0044FF' }}>AT SCALE</span>
                                </h2>
                                <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: '0.9rem', lineHeight: 1.65, maxWidth: '380px', marginBottom: '1.8rem' }}>
                                    10-loop AI engine. Real market data. Hedge-fund analysis for every trader — in under 3 minutes, for cents.
                                </p>

                                {/* Feature pills */}
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                                    {features.map(f => (
                                        <div key={f} className="feature-pill">
                                            <div className="feature-dot" />
                                            {f}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Right: Auth card */}
                            <div className="interactive">
                                <AuthPanel />
                            </div>

                        </div>

                        {/* Bottom bar — purely decorative data strip */}
                        <div className="w-full flex justify-between items-end">
                            <div style={{ display: 'flex', gap: '2.5rem' }}>
                                {[
                                    ['Queries Processed', '10k+'],
                                    ['Avg Analysis Time', '< 3 min'],
                                    ['Cost Per Query', '~$0.02'],
                                ].map(([label, val]) => (
                                    <div key={label} className="flex flex-col gap-1">
                                        <span className="status-label">{label}</span>
                                        <span style={{ fontSize: '1.1rem', fontWeight: 600, color: 'rgba(255,255,255,0.85)' }}>{val}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="status-label" style={{ textAlign: 'right' }}>
                                ATLAS v2.0 — All Systems Nominal
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
