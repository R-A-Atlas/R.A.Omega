<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.A. Omega - Financial Intelligence</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0B1020',
                        surface: '#101827',
                        surfaceHover: '#172235',
                        borderSubtle: 'rgba(220, 226, 235, 0.11)',
                        borderStrong: 'rgba(220, 226, 235, 0.20)',
                        textMuted: 'rgba(157, 169, 183, 0.78)',
                        textMain: '#F4F7FB',
                        accent: {
                            indigo: '#18C6C8',
                            violet: '#7C8AA0',
                            emerald: '#2ED47A'
                        }
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'shimmer': 'shimmer 2s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            'from': { backgroundPosition: '200% 0' },
                            'to': { backgroundPosition: '-200% 0' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            background-color: #0B1020;
            color: #F4F7FB;
            margin: 0;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 50% -12%, rgba(24, 198, 200, 0.12) 0%, rgba(11, 16, 32, 0) 40%),
                linear-gradient(180deg, #111A2C 0%, #0B1020 48%, #0C1324 100%);
        }

        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        ::selection { background-color: rgba(24, 198, 200, 0.32); color: white; }

        /* Structural Panel Class */
        .panel {
            background-color: rgba(16, 24, 39, 0.94);
            border: 1px solid rgba(220, 226, 235, 0.11);
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.36);
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing top border effect */
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(220,226,235,0.22), transparent);
            z-index: 10;
        }

        .input-bar {
            background-color: rgba(16, 24, 39, 0.98);
            border: 1px solid rgba(220, 226, 235, 0.15);
            transition: all 0.2s ease;
        }
        
        .input-bar:focus-within {
            border-color: rgba(24, 198, 200, 0.68);
            box-shadow: 0 0 0 1px rgba(24, 198, 200, 0.26), 0 18px 40px -18px rgba(24, 198, 200, 0.24);
            background-color: #0B1020;
        }

        input:focus { outline: none; }

        /* Code Block Styling */
        .code-block {
            background-color: #070B14;
            border: 1px solid rgba(220,226,235,0.08);
            border-radius: 8px;
        }

        /* Animated Shimmer Text */
        .text-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0.4) 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 2s linear infinite;
        }
    </style>
</head>
<body class="antialiased h-screen w-screen flex flex-col relative">

    <div id="root" class="h-full w-full mx-auto flex flex-col relative z-10 p-2 md:p-3 lg:p-4"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // Robust Icon Component
        const Icon = ({ name, size = 18, className = "", strokeWidth = 1.5 }) => {
            const iconData = lucide.icons[name];
            if (!iconData) {
                console.warn(`Icon '${name}' not found.`);
                return <span className={`inline-block ${className}`} style={{ width: size, height: size }}></span>;
            }
            const elements = (Array.isArray(iconData) && typeof iconData[0] === 'string') ? iconData[1] : iconData;
            
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {Array.isArray(elements) && elements.map((element, index) => {
                        if (!Array.isArray(element)) return null;
                        const Tag = element[0];
                        const attrs = element[1] || {};
                        const reactAttrs = {};
                        for (const [key, value] of Object.entries(attrs)) {
                            const camelKey = key.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
                            reactAttrs[camelKey] = value;
                        }
                        return <Tag key={index} {...reactAttrs} />;
                    })}
                </svg>
            );
        };

        // A minimal, geometric representation of the agent's thought process
        const NodeVisualizer = ({ isProcessing }) => (
            <div className="relative w-10 h-10 flex items-center justify-center">
                <svg width="40" height="40" viewBox="0 0 40 40" className={isProcessing ? 'animate-spin-slow' : 'opacity-50'}>
                    <g stroke="currentColor" strokeWidth="1" fill="none" className={isProcessing ? 'text-accent-indigo' : 'text-white/20'}>
                        {/* Outer Ring */}
                        <circle cx="20" cy="20" r="16" strokeDasharray={isProcessing ? "4 4" : "none"} className="transition-all duration-1000" />
                        {/* Inner Hexagon */}
                        <polygon points="20,8 30.4,14 30.4,26 20,32 9.6,26 9.6,14" className={`transition-all duration-500 ${isProcessing ? 'animate-pulse' : ''}`} />
                        {/* Core Node */}
                        <circle cx="20" cy="20" r="3" fill="currentColor" className={`${isProcessing ? 'shadow-[0_0_10px_#18C6C8]' : ''}`} />
                        {/* Connecting Lines */}
                        <line x1="20" y1="20" x2="20" y2="8" opacity="0.5" />
                        <line x1="20" y1="20" x2="30.4" y2="26" opacity="0.5" />
                        <line x1="20" y1="20" x2="9.6" y2="26" opacity="0.5" />
                    </g>
                </svg>
            </div>
        );

        const API_BASE_FALLBACK = 'http://127.0.0.1:8000';
        const LOOP_STEPS = [
            'Loop 1 of 10: Scraping multiple sources in parallel (news, filings, chains)…',
            'Loop 2 of 10: Cross-referencing facts and tagging source reliability…',
            'Loop 3 of 10: Synthesizing context — volume profile, flow, sector memory…',
            'Loop 4 of 10: Batched Gemini — thesis, macro, scenarios, stress test…',
            'Loop 5 of 10: Personalizing to your portfolio, tracker, and paper trades…',
            'Loop 6 of 10: Python audit — cleaning trade plan, stops, and alerts…',
            'Loop 7 of 10: Execution rules & watch-level hooks…',
            'Loop 8 of 10: Scenario expected value & regime memory…',
            'Loop 9 of 10: Adversarial pass — failure modes & tripwires…',
            'Loop 10 of 10: Narrative compile — TLDR, memo, and handoff…',
        ];

        const DEMO_SOUN_QUERY =
            "Analyze my SOUN $14 Call (Exp 06/18) given today's earnings beat, " +
            'the Walmart ONN TV integration, the 11% AH drop. My avg cost was $0.52. ' +
            'Should I hold, roll, or exit?';

        const DEMO_SOUN_REPLY =
            "Here's a concise frame before you run a fresh Omega pass from the bar below.\n\n" +
            'Your $14 call is a race between catalysts + implied vol and theta into June. ' +
            'The 11% after-hours move matters more for near-term skew than the headline beat alone: ' +
            'the market is repricing path and execution risk after the print and the Walmart / ONN narrative.\n\n' +
            'Hold if you still have a well-defined reclaim level and you are sized so a zero is acceptable. ' +
            'Roll if you want duration but need a lower strike or later expiry to match a realistic target. ' +
            "Exit if the thesis is broken or the position no longer matches risk you'd add at today's spot.\n\n" +
            'Message R.A. Omega runs POST /query - you will see loop progress on the right while the Omega risk engine runs, ' +
            'then real timings, source count, and an estimated Gemini cost when the response lands.';

        function apiBase() {
            try {
                const sameOrigin =
                    window.location && /^https?:$/.test(window.location.protocol)
                        ? window.location.origin
                        : API_BASE_FALLBACK;
                return (localStorage.getItem('atlas_api_base') || sameOrigin || API_BASE_FALLBACK).replace(/\/$/, '');
            } catch (_) {
                return API_BASE_FALLBACK;
            }
        }

        /** POST /query can exceed 5 minutes; browser abort = "signal timed out". Override via localStorage atlas_query_timeout_ms (ms, min 120000, max 3600000). */
        function queryFetchTimeoutMs() {
            try {
                const raw = localStorage.getItem('atlas_query_timeout_ms');
                if (raw != null && raw !== '') {
                    const v = parseInt(raw, 10);
                    if (Number.isFinite(v) && v >= 120000) return Math.min(v, 3600000);
                }
            } catch (_) {}
            return 900000;
        }

        function authHeaders() {
            const tok =
                (typeof localStorage !== 'undefined' &&
                    (localStorage.getItem('atlas_access_token') || localStorage.getItem('ATLAS_TEST_JWT'))) ||
                '';
            const h = { 'Content-Type': 'application/json' };
            if (tok && String(tok).trim()) h['Authorization'] = 'Bearer ' + String(tok).trim();
            return h;
        }

        /** Multipart uploads — omit Content-Type so the browser sets the boundary. */
        function authHeadersMultipart() {
            const tok =
                (typeof localStorage !== 'undefined' &&
                    (localStorage.getItem('atlas_access_token') || localStorage.getItem('ATLAS_TEST_JWT'))) ||
                '';
            const h = {};
            if (tok && String(tok).trim()) h['Authorization'] = 'Bearer ' + String(tok).trim();
            return h;
        }

        function countDataSources(loopOutputs) {
            try {
                const l1 = loopOutputs && loopOutputs.loop1;
                if (!l1) return null;
                const sd = l1.scrape_data;
                const n = sd && typeof sd === 'object' ? Object.keys(sd).length : 0;
                const extra = l1.awareness_data ? 2 : 0;
                const v = n + extra;
                return v > 0 ? v : 8;
            } catch (_) {
                return null;
            }
        }

        function estimateGeminiUsd(timing) {
            if (!timing || typeof timing !== 'object') return '~$0.008';
            const batch = Number(timing.loop_batch_llm) || 0;
            const total = Number(timing.total) || 0;
            const usd = 0.0035 + batch * 0.00018 + total * 0.000025;
            return '~$' + Math.min(0.06, Math.max(0.004, usd)).toFixed(3);
        }

        /** Embed JSON inside <script type="application/json"> without prematurely closing a wrapping script or breaking HTML-adjacent parses. */
        function safeInlineJsonPayload(obj) {
            const s = JSON.stringify(obj === undefined ? null : obj);
            return String(s)
                .replace(/</g, '\\u003c')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029');
        }

        function generateStandaloneReport(rawData, { autoPrint = false } = {}) {
            const data = rawData && typeof rawData === 'object' ? rawData : {};
            const fr = data.final_report && typeof data.final_report === 'object' ? data.final_report : {};

            const normalizePriceLevels = (val) => {
                if (val && typeof val === 'object' && !Array.isArray(val)) return val;
                if (typeof val === 'string') {
                    try {
                        const p = JSON.parse(val);
                        if (p && typeof p === 'object' && !Array.isArray(p)) return p;
                    } catch (_) {}
                }
                return null;
            };

            const normalizeCatalystsTimeline = (val) => {
                if (Array.isArray(val)) return val;
                if (typeof val === 'string') {
                    const s = val.trim();
                    if (!s) return [];
                    try {
                        const p = JSON.parse(s);
                        if (Array.isArray(p)) return p;
                    } catch (_) {}
                    return s
                        .split(/\n+/)
                        .map((line) => {
                            const t = line.replace(/^[-*•\d.)]+\s*/, '').trim();
                            return t ? { event: t, date: '' } : null;
                        })
                        .filter(Boolean);
                }
                return [];
            };

            const priceLevelsRaw = normalizePriceLevels(fr.price_levels);
            const catalystsRaw = normalizeCatalystsTimeline(fr.catalysts_timeline);

            const esc = (s) =>
                String(s ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');

            const formatExecutionRule = (rule) => {
                if (typeof rule === 'string') return rule;
                if (!rule || typeof rule !== 'object') return JSON.stringify(rule);
                const chunks = [];
                if (rule.type) chunks.push(`[${rule.type}]`);
                if (rule.ticker) chunks.push(String(rule.ticker));
                if (rule.trigger_price != null && rule.trigger_price !== '') chunks.push(`@ ${rule.trigger_price}`);
                if (rule.trigger) chunks.push(String(rule.trigger));
                if (rule.action) chunks.push(`→ ${rule.action}`);
                if (rule.priority != null) chunks.push(`(p${rule.priority})`);
                const joined = chunks.join(' ').trim();
                return joined || rule.rule || rule.text || rule.description || JSON.stringify(rule);
            };

            const formatFailureMode = (fm) => {
                if (typeof fm === 'string') return fm;
                if (!fm || typeof fm !== 'object') return JSON.stringify(fm);
                const parts = [
                    fm.mode,
                    fm.tripwire ? `Tripwire: ${fm.tripwire}` : '',
                    fm.response ? `Response: ${fm.response}` : '',
                    fm.probability != null ? `P: ${fm.probability}` : '',
                    fm.description,
                ].filter(Boolean);
                return parts.length ? parts.join(' — ') : fm.text || JSON.stringify(fm);
            };

            const ratingRaw = String(fr.overall_rating || fr.primary_recommendation || '').toLowerCase();
            let accent = '#0044FF';
            if (ratingRaw) {
                if (/\bstrong_buy|strong buy|\bbuy\b/.test(ratingRaw)) accent = '#238636';
                else if (/\bstrong_sell|strong sell|\bsell\b|\bshort\b/.test(ratingRaw)) accent = '#DA3633';
                else if (/\bhold\b|\bneutral\b|\bwait\b/.test(ratingRaw)) accent = '#D29922';
            } else {
                const tldrText = (data.tldr || fr.tldr || '').toLowerCase();
                if (/\b(strong buy|buy|long|add)\b/.test(tldrText)) accent = '#238636';
                else if (/\b(strong sell|sell|exit|close|short)\b/.test(tldrText)) accent = '#DA3633';
                else if (/\b(hold|wait|monitor|watch|roll)\b/.test(tldrText)) accent = '#D29922';
            }

            const topLine = data.tldr || fr.tldr || fr.primary_recommendation || fr.overall_rating;
            const tldrLabel = data.tldr || fr.tldr ? 'TLDR' : fr.primary_recommendation ? 'Recommendation' : 'Outlook';
            const ratingSub =
                fr.overall_rating && String(fr.overall_rating).trim() !== String(topLine || '').trim()
                    ? `<p class="mono muted small rating-sub">Rating: ${esc(fr.overall_rating)}</p>`
                    : '';

            const tp = fr.trade_plan;
            const tpEntry =
                tp && typeof tp === 'object'
                    ? tp.entry_price ?? tp.entry ?? ''
                    : '';
            const tpStop = tp && typeof tp === 'object' ? tp.stop_loss ?? tp.stop ?? '' : '';
            const tpT1 = tp && typeof tp === 'object' ? tp.target_1 ?? tp.target ?? '' : '';
            const tpT2 = tp && typeof tp === 'object' ? tp.target_2 ?? '' : '';
            const tpHasQuad =
                tp &&
                typeof tp === 'object' &&
                [tpEntry, tpStop, tpT1, tpT2].some((v) => v != null && String(v).trim() !== '');
            let tradePlanExtras = '';
            if (tp && typeof tp === 'object') {
                const extras = [
                    ['Action', tp.action],
                    ['Hold period', tp.hold_period],
                ].filter(([, v]) => v != null && String(v).trim() !== '');
                if (extras.length) {
                    tradePlanExtras = extras
                        .map(
                            ([k, v]) =>
                                `<tr><td class="tp-key">${esc(k)}</td><td class="mono tp-val"><span class="content-editable" contenteditable="true">${esc(String(v))}</span></td></tr>`
                        )
                        .join('');
                }
            }

            let tradePlanBlock = '';
            if (fr.trade_plan) {
                if (typeof fr.trade_plan === 'object' && tpHasQuad) {
                    tradePlanBlock = `<table class="tp-table tp-plan-grid"><thead><tr><th>Entry</th><th>Stop Loss</th><th>Target 1</th><th>Target 2</th></tr></thead><tbody><tr><td class="mono tp-val ctr"><span class="content-editable" contenteditable="true">${esc(String(tpEntry))}</span></td><td class="mono tp-val ctr"><span class="content-editable" contenteditable="true">${esc(String(tpStop))}</span></td><td class="mono tp-val ctr"><span class="content-editable" contenteditable="true">${esc(String(tpT1))}</span></td><td class="mono tp-val ctr"><span class="content-editable" contenteditable="true">${esc(String(tpT2))}</span></td></tr></tbody></table>${tradePlanExtras ? `<table class="tp-table">${tradePlanExtras}</table>` : ''}`;
                } else if (typeof fr.trade_plan === 'object' && tradePlanExtras) {
                    tradePlanBlock = `<table class="tp-table">${tradePlanExtras}</table>`;
                } else {
                    const body =
                        typeof fr.trade_plan === 'string'
                            ? esc(fr.trade_plan)
                            : esc(JSON.stringify(fr.trade_plan, null, 2));
                    tradePlanBlock = `<pre class="mono pre-plain content-editable" contenteditable="true">${body}</pre>`;
                }
            }

            // ── Price levels with color-coded dots ──────────────────────
            let priceLevelsBar = '';
            if (priceLevelsRaw) {
                const entries = Object.entries(priceLevelsRaw)
                    .map(([k, v]) => {
                        const n = parseFloat(String(v).replace(/[^0-9.-]/g, ''));
                        return { k, raw: v, n };
                    })
                    .filter((x) => Number.isFinite(x.n));
                if (entries.length >= 1) {
                    const nums = entries.map((e) => e.n);
                    const lo = Math.min(...nums);
                    const hi = Math.max(...nums);
                    const span = hi - lo || 1;
                    const markers = entries
                        .map((e) => {
                            const pct = span > 0 ? ((e.n - lo) / span) * 100 : 50;
                            const kl = (e.k || '').toLowerCase();
                            let dotColor = '#00AFFF';
                            if (kl.includes('support') || kl.includes('floor') || kl.includes('low')) dotColor = '#238636';
                            else if (kl.includes('resist') || kl.includes('ceil') || kl.includes('high') || kl.includes('target')) dotColor = '#DA3633';
                            else if (kl.includes('poc') || kl.includes('current') || kl.includes('price') || kl.includes('now') || kl.includes('vwap')) dotColor = '#D29922';
                            return `<div class="pl-marker" style="left:${pct}%"><div class="pl-dot" style="background:${dotColor}"></div><div class="pl-lab mono">${esc(String(e.k).replace(/_/g, ' '))}</div><div class="pl-val content-editable" contenteditable="true">${esc(String(e.raw))}</div></div>`;
                        })
                        .join('');
                    const plBars = entries
                        .map((e) => {
                            const w = span > 0 ? Math.round(((e.n - lo) / span) * 100) : 50;
                            const kl = (e.k || '').toLowerCase();
                            let barColor = '#00AFFF';
                            if (kl.includes('support') || kl.includes('floor') || kl.includes('low')) barColor = '#238636';
                            else if (kl.includes('resist') || kl.includes('ceil') || kl.includes('high') || kl.includes('target')) barColor = '#DA3633';
                            else if (kl.includes('poc') || kl.includes('current') || kl.includes('price') || kl.includes('now') || kl.includes('vwap')) barColor = '#D29922';
                            return `<div class="pl-bar-row"><span class="pl-bar-key">${esc(String(e.k).replace(/_/g, ' '))}</span><div class="pl-bar-track"><div class="pl-bar-fill" style="width:${w}%;background:${barColor}"></div></div><span class="pl-bar-val content-editable" contenteditable="true">${esc(String(e.raw))}</span></div>`;
                        })
                        .join('');
                    priceLevelsBar = `<div class="pl-wrap pl-combo"><div class="pl-legend"><span class="pl-leg-item"><span class="pl-leg-dot" style="background:#238636"></span>Support</span><span class="pl-leg-item"><span class="pl-leg-dot" style="background:#D29922"></span>POC / VWAP / Spot</span><span class="pl-leg-item"><span class="pl-leg-dot" style="background:#DA3633"></span>Resistance / Target</span></div><div class="pl-rail"><div class="pl-line"></div>${markers}</div><div class="pl-bars">${plBars}</div></div>`;
                }
            }

            // ── Catalyst timeline ────────────────────────────────────────
            let catalystBlock = '';
            const cats = catalystsRaw;
            if (cats.length > 0) {
                catalystBlock = cats
                    .map((c) => {
                        if (typeof c === 'string') {
                            const t = c.trim();
                            if (!t) return '';
                            return `<div class="cat-node"><span class="cat-date mono"></span><span class="cat-event content-editable" contenteditable="true">${esc(t)}</span><span class="cat-meta content-editable" contenteditable="true"></span></div>`;
                        }
                        if (!c || typeof c !== 'object') return '';
                        const dt = c.date || c.when || '';
                        const ev = c.event || c.label || c.title || '';
                        const meta = [c.impact, c.direction].filter(Boolean).join(' · ');
                        return `<div class="cat-node"><span class="cat-date mono content-editable" contenteditable="true">${esc(dt)}</span><span class="cat-event content-editable" contenteditable="true">${esc(ev)}</span><span class="cat-meta content-editable" contenteditable="true">${esc(meta)}</span></div>`;
                    })
                    .filter(Boolean)
                    .join('');
            }

            // ── Scenarios — Bull / Base / Bear columns ─────────────────────
            let scenariosBlock = '';
            const reportScenarios = Array.isArray(data.scenarios) && data.scenarios.length ? data.scenarios : Array.isArray(fr.scenarios) ? fr.scenarios : [];
            if (reportScenarios.length > 0) {
                const scenarioData = reportScenarios.map((sc, i) => {
                    const label = sc.label || sc.name || sc.scenario || `Scenario ${i + 1}`;
                    const raw = parseFloat(sc.probability || sc.prob || 0);
                    const pct = raw > 1 ? Math.round(raw) : Math.round(raw * 100);
                    const desc = [sc.description, sc.summary, sc.outcome, sc.trigger, sc.your_action ? `Your action: ${sc.your_action}` : ''].filter(Boolean).join(' — ');
                    return { label, pct, desc, idx: i, _assigned: false };
                });
                const colMeta = [
                    { title: 'Bull', color: '#238636' },
                    { title: 'Base', color: '#00AFFF' },
                    { title: 'Bear', color: '#DA3633' },
                ];
                const pickSlot = (label) => {
                    const l = (label || '').toLowerCase();
                    if (/\bbull\b/.test(l)) return 0;
                    if (/\bbear\b/.test(l)) return 2;
                    if (/\bbase\b|\bmiddle\b|\bmid\b|\bbalanced\b|\bneutral case\b|\bcentral\b|\bmain\b|\bconsensus\b/.test(l)) return 1;
                    return -1;
                };
                const placed = [null, null, null];
                scenarioData.forEach((sc) => {
                    const s = pickSlot(sc.label);
                    if (s >= 0 && placed[s] == null) {
                        placed[s] = { ...sc, displayLabel: sc.label };
                        sc._assigned = true;
                    }
                });
                const rest = scenarioData.filter((sc) => !sc._assigned);
                let r = 0;
                colMeta.forEach((_, idx) => {
                    if (placed[idx] != null) return;
                    placed[idx] =
                        rest[r] ?
                            {
                                ...rest[r],
                                displayLabel: rest[r].label,
                                _filled: true,
                            } :
                            { label: '', pct: 0, desc: '', displayLabel: colMeta[idx].title, placeholder: true };
                    if (rest[r]) r++;
                });
                scenariosBlock = `<div class="sc-tri-grid">${placed
                    .map((cell, ci) => {
                        const cm = colMeta[ci];
                        const lab = esc(cell.displayLabel || cell.label || cm.title);
                        const pct = typeof cell.pct === 'number' ? cell.pct : 0;
                        const safePct = Math.min(Math.max(pct, 0), 100);
                        const descTxt = esc(cell.desc || '');
                        const descHtml =
                            `<p class="scenario-desc content-editable" contenteditable="true">${cell.placeholder && !descTxt ? '<span class="muted">—</span>' : descTxt || '<span class="muted">—</span>'}</p>`;
                        return `<div class="scenario-col" style="border-top:3px solid ${cm.color}"><div class="scenario-head"><span class="dot" style="background:${cm.color}"></span><span class="scenario-title">${lab}</span><span class="mono scenario-pct">${safePct}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${safePct}%;background:${cm.color}"></div></div>${descHtml}</div>`;
                    })
                    .join('')}</div>`;
            }

            // ── Execution rules ──────────────────────────────────────────
            let rulesBlock = '';
            const reportRules = Array.isArray(data.execution_rules) && data.execution_rules.length ? data.execution_rules : Array.isArray(fr.execution_rules) ? fr.execution_rules : [];
            if (reportRules.length > 0) {
                rulesBlock = reportRules.map((rule, i) => {
                    const text = formatExecutionRule(rule);
                    return `<div class="rule-row"><span class="mono rule-idx">${i + 1}.</span><span class="rule-text content-editable" contenteditable="true">${esc(text)}</span></div>`;
                }).join('');
            }

            const normalizeFmSeverityKey = (raw) => {
                const u = String(raw ?? '').trim().toUpperCase();
                if (u.includes('CRIT')) return 'CRITICAL';
                if (u.includes('HIGH')) return 'HIGH';
                if (u.includes('MED')) return 'MEDIUM';
                if (u.includes('LOW')) return 'LOW';
                return 'HIGH';
            };

            const fmColors = {
                CRITICAL: { bg: 'rgba(218,54,51,0.18)', fg: '#ffb4b0', bd: 'rgba(218,54,51,0.55)' },
                HIGH: { bg: 'rgba(234,88,12,0.16)', fg: '#fdba74', bd: 'rgba(234,88,12,0.45)' },
                MEDIUM: { bg: 'rgba(210,153,34,0.14)', fg: '#f0d078', bd: 'rgba(210,153,34,0.42)' },
                LOW: { bg: 'rgba(107,114,128,0.12)', fg: '#d1d5db', bd: 'rgba(156,163,175,0.35)' },
                RISK: { bg: 'rgba(234,88,12,0.14)', fg: '#fdba74', bd: 'rgba(234,88,12,0.4)' },
            };

            // ── Failure modes ────────────────────────────────────────────
            let fmBlock = '';
            const reportFailureModes = Array.isArray(data.failure_modes) && data.failure_modes.length ? data.failure_modes : Array.isArray(fr.failure_modes) ? fr.failure_modes : [];
            if (reportFailureModes.length > 0) {
                fmBlock = reportFailureModes.map((fm) => {
                    const text = formatFailureMode(fm);
                    const disp =
                        typeof fm === 'object' && fm != null && fm.severity != null && String(fm.severity).trim() !== ''
                            ? String(fm.severity).toUpperCase()
                            : normalizeFmSeverityKey(fm?.severity);
                    const sevKey = normalizeFmSeverityKey(fm?.severity);
                    const pal = fmColors[sevKey] || fmColors.HIGH;
                    return `<div class="fm-row"><span class="mono fm-badge" style="background:${pal.bg};color:${pal.fg};border:1px solid ${pal.bd}">${esc(disp)}</span><span class="fm-text content-editable" contenteditable="true">${esc(text)}</span></div>`;
                }).join('');
            }

            // ── Key risks ────────────────────────────────────────────────
            let keyRisksBlock = '';
            const krs = Array.isArray(fr.key_risks) ? fr.key_risks : [];
            if (krs.length > 0) {
                keyRisksBlock = krs.map((kr) => {
                    if (typeof kr === 'string') return `<div class="kr-row"><span class="kr-bullet">▸</span><span class="kr-text content-editable" contenteditable="true">${esc(kr)}</span></div>`;
                    if (!kr || typeof kr !== 'object') return '';
                    const sevRaw = kr.severity;
                    const pal = fmColors[normalizeFmSeverityKey(sevRaw)] || null;
                    const badge = pal ? `<span class="mono kr-badge" style="background:${pal.bg};color:${pal.fg};border:1px solid ${pal.bd}">${esc(String(sevRaw || '').toUpperCase())}</span>` : '<span class="kr-bullet">▸</span>';
                    const text = kr.risk || kr.description || kr.text || JSON.stringify(kr);
                    return `<div class="kr-row">${badge}<span class="kr-text content-editable" contenteditable="true">${esc(text)}</span></div>`;
                }).filter(Boolean).join('');
            }

            // ── Bull / Bear thesis columns ───────────────────────────────
            const bullText = fr.bull_thesis || '';
            const bearText = fr.bear_thesis || '';
            let thesisBlock = '';
            if (bullText || bearText) {
                const bullCol = bullText ? `<div class="thesis-col bull-col"><div class="thesis-head"><span class="thesis-dot" style="background:#238636"></span><span class="mono thesis-label">Bull Case</span></div><div class="thesis-body content-editable" contenteditable="true">${esc(bullText)}</div></div>` : '';
                const bearCol = bearText ? `<div class="thesis-col bear-col"><div class="thesis-head"><span class="thesis-dot" style="background:#DA3633"></span><span class="mono thesis-label">Bear Case</span></div><div class="thesis-body content-editable" contenteditable="true">${esc(bearText)}</div></div>` : '';
                thesisBlock = `<div class="thesis-grid">${bullCol}${bearCol}</div>`;
            }

            // ── Options play ─────────────────────────────────────────────
            const optionsRaw = fr.options_play || '';
            let optionsBlock = '';
            if (optionsRaw) {
                if (typeof optionsRaw === 'string' && optionsRaw.trim()) {
                    optionsBlock = `<div class="prose content-editable" contenteditable="true" style="white-space:pre-wrap">${esc(optionsRaw)}</div>`;
                } else if (typeof optionsRaw === 'object' && optionsRaw !== null) {
                    const priorityKeys = ['strategy','type','ticker','direction','strikes','strike','expiry','expiration','premium','debit','credit','max_gain','max_loss','breakeven','iv','delta','rationale','notes'];
                    const allKeys = [...new Set([...priorityKeys, ...Object.keys(optionsRaw)])].filter(k => optionsRaw[k] != null && String(optionsRaw[k]).trim() !== '');
                    const rows = allKeys.map(k => {
                        const label = k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
                        const val = String(optionsRaw[k]);
                        return `<tr><td class="tp-key">${esc(label)}</td><td class="mono tp-val" style="white-space:pre-wrap"><span class="content-editable" contenteditable="true">${esc(val)}</span></td></tr>`;
                    }).join('');
                    if (rows) optionsBlock = `<table class="tp-table">${rows}</table>`;
                }
            }

            // ── Analyst consensus ────────────────────────────────────────
            let analystBlock = '';
            const ac = fr.analyst_consensus;
            if (ac && typeof ac === 'object') {
                const rows = [['Rating', ac.consensus || ac.rating], ['Price Target', ac.price_target || ac.avg_target], ['Buy %', ac.buy_pct != null ? ac.buy_pct + '%' : null], ['Hold %', ac.hold_pct != null ? ac.hold_pct + '%' : null], ['Sell %', ac.sell_pct != null ? ac.sell_pct + '%' : null], ['Analysts', ac.num_analysts || ac.count]].filter(([, v]) => v != null && String(v).trim() !== '');
                if (rows.length > 0) analystBlock = `<table class="tp-table">${rows.map(([k, v]) => `<tr><td class="tp-key">${esc(k)}</td><td class="mono tp-val"><span class="content-editable" contenteditable="true">${esc(String(v))}</span></td></tr>`).join('')}</table>`;
            } else if (typeof ac === 'string' && ac.trim()) {
                analystBlock = `<div class="prose content-editable" contenteditable="true">${esc(ac)}</div>`;
            }

            // ── Hedge fund brief ─────────────────────────────────────────
            const hfText = data.hedge_fund_brief || fr.hedge_fund_brief || '';
            const hfBlock = (hfText && typeof hfText === 'string' && hfText.trim()) ? `<div class="prose content-editable" contenteditable="true">${esc(hfText)}</div>` : '';

            // ── Confidence gauge ─────────────────────────────────────────
            const confRaw = fr.confidence;
            let confPct = 0, confLabel = '';
            if (confRaw != null) {
                const n = parseFloat(String(confRaw).replace(/[^0-9.]/g, ''));
                if (Number.isFinite(n)) {
                    confPct = n > 1 ? Math.min(100, Math.round(n)) : Math.min(100, Math.round(n * 100));
                    confLabel = String(confRaw);
                }
            }
            const confGauge = confPct > 0 ? `<div class="conf-wrap"><div class="conf-label-row"><span class="mono muted small">Confidence</span><span class="mono small" style="color:#00AFFF">${esc(confLabel)}</span></div><div class="conf-track"><div class="conf-fill" style="width:${confPct}%"></div></div></div>` : '';

            // ── Assemble sections ────────────────────────────────────────
            const execText = fr.executive_summary || fr.executive_brief || '';
            const execSection = execText && `<section class="card sec-exec"><h2 class="card-label">Executive Summary</h2><div class="card-body prose content-editable" contenteditable="true">${esc(execText)}</div></section>`;
            const thesisSection = thesisBlock && `<section class="card sec-thesis"><h2 class="card-label">Bull vs Bear Thesis</h2><div class="card-body">${thesisBlock}</div></section>`;
            const tpSection = tradePlanBlock && `<section class="card sec-tp"><h2 class="card-label">Trade Plan</h2><div class="card-body">${tradePlanBlock}</div></section>`;
            const optionsSection = optionsBlock && `<section class="card sec-options"><h2 class="card-label">Options Play</h2><div class="card-body">${optionsBlock}</div></section>`;
            const scSection = scenariosBlock && `<section class="card sec-sc"><h2 class="card-label">Scenarios</h2><div class="card-body">${scenariosBlock}</div></section>`;
            const plSection = priceLevelsBar && `<section class="card sec-pl"><h2 class="card-label">Price Levels</h2><div class="card-body">${priceLevelsBar}</div></section>`;
            const krSection = keyRisksBlock && `<section class="card sec-kr"><h2 class="card-label">Key Risks</h2><div class="card-body kr-wrap">${keyRisksBlock}</div></section>`;
            const rulesSection = rulesBlock && `<section class="card sec-rules"><h2 class="card-label">Execution Rules</h2><div class="card-body rules-wrap">${rulesBlock}</div></section>`;
            const fmSection = fmBlock && `<section class="card sec-fm"><h2 class="card-label">Failure Modes</h2><div class="card-body fm-wrap">${fmBlock}</div></section>`;
            const catSection = catalystBlock && `<section class="card sec-cat"><h2 class="card-label">Catalyst Timeline</h2><div class="cat-strip-wrap"><div class="cat-strip">${catalystBlock}</div></div></section>`;
            const analystSection = analystBlock && `<section class="card sec-analyst"><h2 class="card-label">Analyst Consensus</h2><div class="card-body">${analystBlock}</div></section>`;
            const hfSection = hfBlock && `<section class="card sec-hf memo-card memo-hf"><h2 class="card-label memo-hf-label">Hedge Fund Brief</h2><div class="card-body memo-body">${hfBlock}</div></section>`;
            const traderMemo = data.trader_memo || fr.trader_memo || '';
            const memoSection = traderMemo && `<section class="card memo-card memo-trader sec-memo"><h2 class="card-label trader-memo-label">Trader Memo</h2><div class="card-body memo-body trader-memo-body content-editable" contenteditable="true">${esc(traderMemo)}</div></section>`;

            const extendedPieces = [thesisSection, optionsSection, krSection, analystSection, hfSection].filter(Boolean);
            const extendedBlock =
                extendedPieces.length > 0
                    ? `<div class="extended-wrap"><div class="extended-label mono">Extended context</div>${extendedPieces.join('')}</div>`
                    : '';

            const topSection = topLine && `<section class="hero sec-tldr" style="border-left-color:${accent}"><p class="mono hero-label">${esc(tldrLabel)}</p><p class="hero-text content-editable" contenteditable="true">${esc(topLine)}</p>${ratingSub}${confGauge}</section>`;

            const pq = data.parsed_query && typeof data.parsed_query === 'object' ? data.parsed_query : {};
            const tickerStr = (Array.isArray(pq.tickers) && pq.tickers.length ? pq.tickers.join(', ') : '') || '';
            const confStr = pq.confidence != null && pq.confidence !== '' ? String(pq.confidence) : fr.confidence != null && fr.confidence !== '' ? String(fr.confidence) : '';
            const queryLine = data.query ? `<p class="mono muted small meta-query">Query: ${esc(data.query)}</p>` : '';

            const headStyle = `:root{--bg:#0D1117;--surface:rgba(255,255,255,0.04);--border:rgba(240,246,252,0.12);--text:#E6EDF3;--muted:rgba(255,255,255,0.45);--accent:#0044FF;--accent2:#00AFFF}

            return `<!DOCTYPE html>

</header>
${topSection || ''}
${execSection || ''}

<footer class="meta">Generated by R.A. Omega · ${esc(new Date().toISOString())}<span class="disclaimer">R.A. Omega utilizes multi-loop validation for high-conviction algorithmic intelligence, but output does not constitute certified legal, tax, fiduciary, or investment advice.</span></footer>

        }

        function SessionsChatsPanel({
            sessions,
            sessionsLoading,
            sessionsUnavailable,
            sessionsError,
            activeSessionId,
            processingBySession,
            regimeState,
            onNewChat,
            onRefreshSessions,
            onSelectSession,
            onRenameSession,
            onArchiveSession,
            onDeleteSession,
            voiceRecording,
            voiceBusy,
            onVoiceToggle,
        }) {
            const sessionTimeLabel = (s) => {
                const raw = s && (s.updated_at || s.created_at);
                if (!raw) return '';
                try {
                    const d = new Date(raw);
                    if (Number.isNaN(d.getTime())) return '';
                    const min = Math.floor(Math.max(0, Date.now() - d.getTime()) / 60000);
                    if (min < 1) return 'now';
                    if (min < 60) return `${min}m`;
                    const hr = Math.floor(min / 60);
                    if (hr < 24) return `${hr}h`;
                    const day = Math.floor(hr / 24);
                    if (day < 7) return `${day}d`;
                    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
                } catch (_) {
                    return '';
                }
            };

            return (
                <>
                    <div className="flex items-center gap-3 mb-4 px-2 mt-2">
                        <div className="w-7 h-7 rounded-lg bg-accent-indigo/12 border border-accent-indigo/45 flex items-center justify-center shadow-[0_0_18px_rgba(91,157,255,0.18)]">
                            <Icon name="Hexagon" size={14} className="text-white" strokeWidth={2.5} />

                        <div className="min-w-0">

                    </div>

                    <button

                        <span>New chat</span>
                    </button>

                    {sessionsUnavailable && (

                        </div>
                    )}

                    {sessionsError && !sessionsUnavailable && (
                        <div className="mb-3 px-2 py-2 rounded-lg border border-red-500/30 bg-red-500/10 text-[11px] text-red-200/90 leading-snug">

                            <button
