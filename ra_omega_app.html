                                onClick={onRefreshSessions}
                                className="mt-2 inline-flex items-center gap-1 rounded border border-red-400/30 px-2 py-1 text-[10px] font-mono text-red-100 hover:bg-red-500/10"
                            >
                                <Icon name="RefreshCw" size={11} />
                                Retry
                            </button>
                        </div>
                    )}

                    <div className="flex items-center justify-between mb-2 px-2">
                        <div className="text-[10px] font-mono text-textMuted uppercase tracking-wider">Chats</div>
                        <button
                            type="button"
                            onClick={onRefreshSessions}
                            className="p-1 rounded text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors"
                            title="Refresh chats"
                        >
                            <Icon name="RefreshCw" size={12} />
                        </button>
                    </div>
                    <div className="space-y-1 flex-1 overflow-y-auto min-h-0">
                        {sessionsLoading && !sessions.length && (
                            <div className="text-[11px] text-textMuted px-2">Loading…</div>
                        )}
                        {!sessionsLoading && !sessions.length && !sessionsError && (
                            <div className="text-[11px] text-textMuted px-2">No chats yet — type a message in the main box to create one</div>
                        )}
                        {sessions.map((s) => {
                            const isActive = activeSessionId === String(s.id);
                            const sidKey = String(s.id);
                            const isBusy = !!(processingBySession && processingBySession[sidKey]);
                            const timeLabel = sessionTimeLabel(s);
                            return (
                                <div key={s.id} className={`group relative rounded-lg border ${isActive ? 'bg-surfaceHover border-accent-indigo/35 shadow-[inset_2px_0_0_rgba(24,198,200,0.8)]' : 'border-transparent hover:bg-surfaceHover hover:border-borderSubtle'} transition-colors`}>
                                    <button
                                        type="button"
                                        onClick={() => onSelectSession(s.id)}
                                        className={`w-full text-left px-3 py-2 text-sm pr-[4.5rem] ${isActive ? 'text-textMain' : 'text-textMuted'}`}
                                    >
                                        <div className="flex items-center gap-2 min-w-0">
                                            {isBusy ? (
                                                <Icon name="Loader2" size={14} className="text-accent-indigo shrink-0 animate-spin" aria-hidden />
                                            ) : (
                                                <Icon name="MessageSquare" size={14} className="text-textMuted/75 shrink-0" aria-hidden />
                                            )}
                                            <span className="truncate">{s.title || 'Chat'}</span>
                                            {timeLabel && <span className="ml-auto text-[10px] font-mono text-textMuted/70 shrink-0">{timeLabel}</span>}
                                        </div>
                                        {s.context_topic && (
                                            <div className="text-[10px] font-mono text-accent-indigo/75 truncate mt-0.5">{s.context_topic}</div>
                                        )}
                                    </button>
                                    <div className="absolute right-1 top-1/2 -translate-y-1/2 hidden group-hover:flex items-center gap-0.5">
                                        <button
                                            type="button"
                                            title="Archive"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onArchiveSession(s.id);
                                            }}
                                            className="p-1 rounded text-textMuted hover:text-amber-400 transition-colors"
                                        >
                                            <Icon name="Archive" size={13} strokeWidth={2} />
                                        </button>
                                        <button
                                            type="button"
                                            title="Rename"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onRenameSession(s.id);
                                            }}
                                            className="p-1 rounded text-textMuted hover:text-textMain transition-colors"
                                        >
                                            ✎
                                        </button>
                                        <button
                                            type="button"
                                            title="Delete"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onDeleteSession(s.id);
                                            }}
                                            className="p-1 rounded text-textMuted hover:text-red-400 transition-colors"
                                        >
                                            🗑
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="pt-3 border-t border-borderSubtle mt-auto shrink-0 space-y-1">
                        <a
                            href="/dashboard"
                            className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors"
                            title="Finance dashboard"
                        >
                            <Icon name="LayoutDashboard" size={15} />
                            <span>Finance Dashboard</span>
                        </a>
                        <a
                            href="/pricing"
                            className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors"
                            title="Pricing and billing"
                        >
                            <Icon name="CreditCard" size={15} />
                            <span>Pricing</span>
                        </a>
                        <button
                            type="button"
                            className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors"
                            title="Projects and vault"
                        >
                            <Icon name="FolderKanban" size={15} />
                            <span>Projects / Vault</span>
                        </button>
                        <button
                            type="button"
                            className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors"
                            title="Plugins"
                        >
                            <Icon name="Puzzle" size={15} />
                            <span>Plugins</span>
                        </button>
                        <button
                            type="button"
                            className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-textMuted hover:text-textMain hover:bg-surfaceHover transition-colors"
                            title="Settings"
                            onClick={() => {
                                const ev = new CustomEvent('atlas-open-settings');
                                window.dispatchEvent(ev);
                            }}
                        >
                            <Icon name="Settings" size={15} />
                            <span>Settings</span>
                        </button>
                    </div>

                    <div className="pt-4 border-t border-borderSubtle mt-3 text-[10px] font-mono text-textMuted px-2 leading-relaxed space-y-1 shrink-0">
                        <div>
                            <span className="text-textMuted/80">Market regime</span>
                            <span className="block text-textMain mt-0.5">
                                {regimeState.loading ? 'Loading…' : regimeState.label}
                            </span>
                            {regimeState.signal ? (
                                <span className="block text-[9px] opacity-80 truncate" title={regimeState.signal}>
                                    {regimeState.signal}
                                </span>
                            ) : null}
                        </div>
                        <div>Omega Engine / risk loops / POST /query</div>
                        <div className="pt-2 text-[9px] leading-snug text-textMuted/90">
                            Output is algorithmic intelligence, not certified legal, tax, fiduciary, or investment advice.
                        </div>
                    </div>
                </>
            );
        }

        const QuickStatsStrip = ({ data }) => {
            const fr = data.final_report || {};

            const riskLevel = (() => {
                let hi = 0;
                const fmSrc =
                    Array.isArray(data.failure_modes) && data.failure_modes.length
                        ? data.failure_modes
                        : Array.isArray(fr.failure_modes)
                          ? fr.failure_modes
                          : [];
                for (const m of fmSrc) {
                    const s = String((m && m.severity) || '').toLowerCase();
                    if (s === 'critical' || s === 'high') hi++;
                }
                const risks = Array.isArray(fr.risks_and_tripwires) ? fr.risks_and_tripwires : [];
                for (const x of risks) {
                    const s = String((x && x.severity) || '').toLowerCase();
                    if (s === 'critical' || s === 'high') hi++;
                }
                const kr = Array.isArray(fr.key_risks) ? fr.key_risks : [];
                for (const x of kr) {
                    const s = String((x && x.severity) || '').toLowerCase();
                    if (s === 'high') hi++;
                }
                if (hi >= 3) return 'high';
                if (hi >= 1) return 'medium';
                return 'low';
            })();

            const impactLevel = (() => {
                const rat = String(fr.overall_rating || '').toLowerCase().replace(/\s+/g, '_');
                if (rat.includes('strong_buy') || rat === 'buy') return 'high';
                if (rat.includes('strong_sell') || rat === 'sell') return 'low';
                const urg = String(fr.urgency || '').toLowerCase();
                if (urg === 'critical' || urg === 'urgent') return 'high';
                return 'medium';
            })();

            const meterColor  = { high: 'bg-red-400',     medium: 'bg-amber-400', low: 'bg-emerald-400' };
            const tagColor    = { high: 'text-red-400',   medium: 'text-amber-400', low: 'text-emerald-400' };
            const impactMeter = { high: 'bg-emerald-400', medium: 'bg-amber-400', low: 'bg-red-400' };
            const impactTag   = { high: 'text-emerald-400', medium: 'text-amber-400', low: 'text-red-400' };
            const riskW   = { high: '100%', medium: '55%', low: '28%' };
            const impactW = { high: '92%',  medium: '50%', low: '32%' };

            return (
                <div className="flex gap-6 mb-3 px-4 py-2.5 rounded-lg border border-borderSubtle bg-surface/20">
                    <div className="flex-1">
                        <div className="text-[10px] font-mono text-textMuted mb-1 uppercase tracking-widest">Risk Level</div>
                        <div className="w-full bg-surface/50 rounded-full h-1.5 mb-1">
                            <div className={`h-1.5 rounded-full transition-all ${meterColor[riskLevel]}`} style={{ width: riskW[riskLevel] }} />
                        </div>
                        <span className={`text-[10px] font-mono font-semibold ${tagColor[riskLevel]}`}>{riskLevel}</span>
                    </div>
                    <div className="flex-1">
                        <div className="text-[10px] font-mono text-textMuted mb-1 uppercase tracking-widest">Financial Impact</div>
                        <div className="w-full bg-surface/50 rounded-full h-1.5 mb-1">
                            <div className={`h-1.5 rounded-full transition-all ${impactMeter[impactLevel]}`} style={{ width: impactW[impactLevel] }} />
                        </div>
                        <span className={`text-[10px] font-mono font-semibold ${impactTag[impactLevel]}`}>{impactLevel}</span>
                    </div>
                </div>
            );
        };

        const StructuredResponse = ({ data }) => {
            const fr = data.final_report || {};
            const listFrom = (key) =>
                Array.isArray(data[key]) && data[key].length
                    ? data[key]
                    : Array.isArray(fr[key])
                      ? fr[key]
                      : [];
            const textFrom = (key) => {
                const v = data[key] != null && data[key] !== '' ? data[key] : fr[key];
                return v == null ? '' : String(v);
            };
            const scenarios = listFrom('scenarios');
            const executionRules = listFrom('execution_rules');
            const failureModes = listFrom('failure_modes');
            const traderMemo = textFrom('trader_memo');
            const executiveSummary =
                fr.executive_summary ||
                fr.executive_brief ||
                data.executive_summary ||
                data.executive_brief ||
                '';

            const ratingRaw = String(fr.overall_rating || fr.primary_recommendation || '').toLowerCase();
            let tldrBorder = 'border-accent-indigo';
            if (ratingRaw) {
                if (/\bstrong_buy|strong buy|\bbuy\b/.test(ratingRaw)) tldrBorder = 'border-emerald-500';
                else if (/\bstrong_sell|strong sell|\bsell\b|\bshort\b/.test(ratingRaw)) tldrBorder = 'border-red-500';
                else if (/\bhold\b|\bneutral\b|\bwait\b/.test(ratingRaw)) tldrBorder = 'border-amber-400';
            } else {
                const tldrText = (data.tldr || fr.tldr || '').toLowerCase();
                if (/\b(strong buy|buy|long|add)\b/.test(tldrText)) tldrBorder = 'border-emerald-500';
                else if (/\b(strong sell|sell|exit|close|short)\b/.test(tldrText)) tldrBorder = 'border-red-500';
                else if (/\b(hold|wait|monitor|watch|roll)\b/.test(tldrText)) tldrBorder = 'border-amber-400';
            }

            const CardWrap = ({ title, children }) => (
                <div className="rounded-lg border border-borderSubtle bg-surface/30 p-4 mb-3">
                    <div className="text-[10px] font-mono uppercase tracking-widest text-textMuted mb-2">{title}</div>
                    {children}
                </div>
            );

            const scenarioColors = (label) => {
                const l = (label || '').toLowerCase();
                if (l.includes('bull')) return { dot: '#10b981', bar: 'bg-emerald-500' };
                if (l.includes('bear')) return { dot: '#ef4444', bar: 'bg-red-500' };
                return { dot: '#6b7280', bar: 'bg-gray-500' };
            };

            const severityClass = (sev) => {
                const s = (sev || 'RISK').toUpperCase();
                const map = {
                    CRITICAL: 'bg-red-600/25 text-red-300 border-red-500/40',
                    HIGH: 'bg-red-500/20 text-red-400 border-red-500/30',
                    MEDIUM: 'bg-amber-400/20 text-amber-400 border-amber-400/30',
                    LOW: 'bg-gray-500/20 text-gray-400 border-gray-500/30',
                    RISK: 'bg-orange-500/20 text-orange-400 border-orange-500/30',
                };
                return map[s] || map.RISK;
            };

            const formatExecutionRule = (rule) => {
                if (typeof rule === 'string') return rule;
                if (!rule || typeof rule !== 'object') return JSON.stringify(rule);
                const chunks = [];
                if (rule.type) chunks.push(`[${rule.type}]`);
                if (rule.ticker) chunks.push(String(rule.ticker));
                if (rule.trigger_price != null && rule.trigger_price !== '') chunks.push(`@ ${rule.trigger_price}`);
                if (rule.trigger) chunks.push(String(rule.trigger));
                if (rule.action) chunks.push(`→ ${rule.action}`);
                if (rule.priority != null) chunks.push(`(p${rule.priority})`);
                const joined = chunks.join(' ').trim();
                return joined || rule.rule || rule.text || rule.description || JSON.stringify(rule);
            };

            const formatFailureMode = (fm) => {
                if (typeof fm === 'string') return fm;
                if (!fm || typeof fm !== 'object') return JSON.stringify(fm);
                const parts = [
                    fm.mode,
                    fm.tripwire ? `Tripwire: ${fm.tripwire}` : '',
                    fm.response ? `Response: ${fm.response}` : '',
                    fm.probability != null ? `P: ${fm.probability}` : '',
                    fm.description,
                ].filter(Boolean);
                return parts.length ? parts.join(' — ') : (fm.text || JSON.stringify(fm));
            };

            const tp = fr.trade_plan;
            const tradePlanRows =
                tp && typeof tp === 'object'
                    ? [
                          ['Action', tp.action],
                          ['Entry', tp.entry_price ?? tp.entry],
                          ['Stop', tp.stop_loss ?? tp.stop],
                          ['Target 1', tp.target_1 ?? tp.target],
                          ['Target 2', tp.target_2],
                          ['Hold period', tp.hold_period],
                          ['Size', tp.position_size_suggestion],
                      ].filter(([, v]) => v != null && String(v).trim() !== '')
                    : [];

            const topLine = data.tldr || fr.tldr || fr.primary_recommendation || fr.overall_rating;

            const hasContent =
                topLine ||
                executiveSummary ||
                fr.bull_thesis ||
                fr.bear_thesis ||
                fr.trade_plan ||
                scenarios.length ||
                executionRules.length ||
                failureModes.length ||
                traderMemo;

            if (!hasContent) {
                return (
                    <div className="text-[15px] leading-relaxed text-textMain/90">
                        {(data.tldr || fr.headline || JSON.stringify(data)).slice(0, 800)}
                    </div>
                );
            }

            return (
                <div className="w-full">
                    <QuickStatsStrip data={data} />
                    {topLine && (
                        <div className={`rounded-lg border-l-4 ${tldrBorder} bg-surface/30 border border-borderSubtle p-4 mb-3`}>
                            <div className="text-[10px] font-mono uppercase tracking-widest text-textMuted mb-2">
                                {data.tldr ? 'TLDR' : fr.primary_recommendation ? 'Recommendation' : 'Outlook'}
                            </div>
                            <div className="text-xl font-semibold text-textMain leading-snug">{topLine}</div>
                            {fr.overall_rating &&
                                String(fr.overall_rating).trim() !== String(topLine).trim() && (
                                    <div className="text-[11px] font-mono text-textMuted mt-2">Rating: {fr.overall_rating}</div>
                                )}
                        </div>
                    )}

                    {executiveSummary && (
                        <CardWrap title="Executive Summary">
                            <div className="text-sm text-textMain/85 leading-relaxed whitespace-pre-wrap">{executiveSummary}</div>
                        </CardWrap>
                    )}

                    {fr.bull_thesis && (
                        <CardWrap title="Bull thesis">
                            <div className="text-sm text-textMain/85 leading-relaxed whitespace-pre-wrap">{fr.bull_thesis}</div>
                        </CardWrap>
                    )}

                    {fr.bear_thesis && (
                        <CardWrap title="Bear thesis">
                            <div className="text-sm text-textMain/85 leading-relaxed whitespace-pre-wrap">{fr.bear_thesis}</div>
                        </CardWrap>
                    )}

                    {fr.trade_plan && (
                        <CardWrap title="Trade Plan">
                            {typeof fr.trade_plan === 'object' && tradePlanRows.length > 0 ? (
                                <div>
                                    <table className="w-full text-sm border-collapse">
                                        <tbody>
                                            {tradePlanRows.map(([k, v]) => (
                                                <tr key={k} className="border-b border-borderSubtle/60 last:border-0">
                                                    <td className="py-1.5 pr-4 text-[10px] font-mono uppercase tracking-widest text-textMuted align-top w-[110px]">
                                                        {k}
                                                    </td>
                                                    <td className="py-1.5 text-textMain font-mono">{String(v)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {fr.price_levels && typeof fr.price_levels === 'object' && (
                                        <div className="text-xs text-textMuted mt-3 leading-relaxed">
                                            {Object.entries(fr.price_levels).map(([k, v]) => (
                                                <div key={k}>
                                                    <span className="font-mono text-[10px] uppercase text-textMuted">
                                                        {k.replace(/_/g, ' ')}:
                                                    </span>{' '}
                                                    {String(v)}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="text-sm text-textMain/85 leading-relaxed whitespace-pre-wrap">
                                    {typeof fr.trade_plan === 'string' ? fr.trade_plan : JSON.stringify(fr.trade_plan, null, 2)}
                                </div>
                            )}
                        </CardWrap>
                    )}

                    {scenarios.length > 0 && (
                        <CardWrap title="Scenarios">
                            <div className="space-y-3">
                                {scenarios.map((sc, i) => {
                                    const label = sc.label || sc.name || sc.scenario || `Scenario ${i + 1}`;
                                    const raw = parseFloat(sc.probability || sc.prob || 0);
                                    const pct = raw > 1 ? Math.round(raw) : Math.round(raw * 100);
                                    const desc = [sc.description, sc.summary, sc.outcome, sc.trigger, sc.your_action ? `Your action: ${sc.your_action}` : '']
                                        .filter(Boolean)
                                        .join(' — ');
                                    const { dot, bar } = scenarioColors(label);
                                    return (
                                        <div key={i}>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span style={{ width: 8, height: 8, borderRadius: '50%', background: dot, flexShrink: 0, display: 'inline-block' }} />
                                                <span className="text-sm font-medium text-textMain capitalize">{label}</span>
                                                <span className="text-xs font-mono text-textMuted ml-auto">{pct}%</span>
                                            </div>
                                            <div className="w-full bg-surface/50 rounded-full h-1.5 mb-1">
                                                <div className={`h-1.5 rounded-full ${bar}`} style={{ width: `${Math.min(pct, 100)}%` }} />
                                            </div>
                                            {desc && <div className="text-xs text-textMuted leading-relaxed">{desc}</div>}
                                        </div>
                                    );
                                })}
                            </div>
                        </CardWrap>
                    )}

                    {executionRules.length > 0 && (
                        <CardWrap title="Execution Rules">
                            {executionRules.map((rule, i) => (
                                <div
                                    key={i}
                                    className={`flex gap-3 py-2 ${i < executionRules.length - 1 ? 'border-b border-borderSubtle' : ''}`}
                                >
                                    <span className="text-[10px] font-mono text-textMuted shrink-0 pt-0.5 w-12">RULE {i + 1}</span>
                                    <span className="text-sm text-textMain/90 leading-relaxed">{formatExecutionRule(rule)}</span>
                                </div>
                            ))}
                        </CardWrap>
                    )}

                    {failureModes.length > 0 && (
                        <CardWrap title="Failure Modes">
                            <div className="space-y-2">
                                {failureModes.map((fm, i) => {
                                    const text = formatFailureMode(fm);
                                    const sev = typeof fm === 'object' && fm ? fm.severity || 'RISK' : 'RISK';
                                    return (
                                        <div key={i} className="flex gap-2 items-start">
                                            <span
                                                className={`text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border shrink-0 mt-0.5 ${severityClass(sev)}`}
                                            >
                                                {String(sev).toUpperCase()}
                                            </span>
                                            <span className="text-sm text-textMain/85 leading-relaxed">{text}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </CardWrap>
                    )}

                    {traderMemo && (
                        <div className="rounded-lg border border-accent-indigo/20 border-l-4 border-l-accent-indigo bg-accent-indigo/5 p-4 mb-3">
                            <div className="text-[10px] font-mono uppercase tracking-widest text-accent-indigo/70 mb-2">Trader Memo</div>
                            <div className="text-sm italic text-textMain/80 leading-relaxed whitespace-pre-wrap">{traderMemo}</div>
                        </div>
                    )}
                </div>
            );
        };

        function generateInfographic(rawData, { autoPrint = false } = {}) {
            const data = rawData && typeof rawData === 'object' ? rawData : {};
            const fr = data.final_report && typeof data.final_report === 'object' ? data.final_report : {};
            const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

            const ratingRaw = String(fr.overall_rating || '').toLowerCase();
            let accentHex = '#0044FF';
            if (/strong_buy|\bbuy\b/.test(ratingRaw)) accentHex = '#238636';
            else if (/strong_sell|\bsell\b|short/.test(ratingRaw)) accentHex = '#DA3633';
            else if (/hold|neutral/.test(ratingRaw)) accentHex = '#D29922';

            const pq = data.parsed_query && typeof data.parsed_query === 'object' ? data.parsed_query : {};
            const ticker = (Array.isArray(pq.tickers) && pq.tickers[0]) || fr.ticker || '—';
            const price = fr.price_now ? `$${fr.price_now}` : '—';
            const rating = fr.overall_rating || '—';
            const confRaw = fr.confidence;
            let confN = 0;
            if (confRaw != null) { const n = parseFloat(String(confRaw).replace(/[^0-9.]/g,'')); if (Number.isFinite(n)) confN = n > 1 ? n : Math.round(n * 100); }

            // Scenarios — palette aligned with standalone report
            const scenarios = Array.isArray(data.scenarios) && data.scenarios.length
                ? data.scenarios
                : Array.isArray(fr.scenarios)
                  ? fr.scenarios
                  : [];
            const scData = scenarios.map((sc, i) => {
                const label = sc.label || sc.name || `S${i+1}`;
                const raw = parseFloat(sc.probability || 0);
                const pct = raw > 1 ? Math.round(raw) : Math.round(raw * 100);
                const l = label.toLowerCase();
                const color = l.includes('bull') ? '#238636' : l.includes('bear') ? '#DA3633' : '#00AFFF';
                return { label, pct, color };
            });

            // Price levels — values for Chart.js fallback rows
            const plEntries = fr.price_levels && typeof fr.price_levels === 'object'
                ? Object.entries(fr.price_levels).map(([k, v]) => {
                    const n = parseFloat(String(v).replace(/[^0-9.-]/g,''));
                    const kl = k.toLowerCase();
                    let color = '#0044FF';
                    if (kl.includes('support') || kl.includes('floor')) color = '#238636';
                    else if (kl.includes('resist') || kl.includes('target') || kl.includes('high')) color = '#DA3633';
                    else if (kl.includes('poc') || kl.includes('current') || kl.includes('now') || kl.includes('vwap')) color = '#D29922';
                    return { k, n, color };
                }).filter(x => Number.isFinite(x.n)).sort((a,b) => a.n - b.n)
                : [];
            const plMax = plEntries.length ? Math.max(...plEntries.map(e => e.n)) : 1;

            const normalizeCatsIG = (val) => {
                if (Array.isArray(val)) return val;
                if (typeof val === 'string') {
                    const s = val.trim();
                    if (!s) return [];
                    try { const p = JSON.parse(s); if (Array.isArray(p)) return p; } catch (_) {}
                    return s.split(/\n+/).map((line) => {
                        const t = line.replace(/^[-*•\d.)]+\s*/, '').trim();
                        return t ? { event: t, date: '' } : null;
                    }).filter(Boolean);
                }
                return [];
            };
            let catsIgHtml = '';
            {
                const arr = normalizeCatsIG(fr.catalysts_timeline);
                if (arr.length > 0) {
                    catsIgHtml = arr.map((c) => {
                        if (typeof c === 'string') return `<div class="igcat-node">${esc(c)}</div>`;
                        const dt = c.date || c.when || '';
                        const ev = c.event || c.label || c.title || '';
                        const meta = [c.impact, c.direction].filter(Boolean).join(' · ');
                        return `<div class="igcat-node"><div class="igcat-d">${esc(dt)}</div><div class="igcat-e">${esc(ev)}</div>${meta ? `<div class="igcat-m">${esc(meta)}</div>` : ''}</div>`;
                    }).join('');
                }
            }

            // Key risks
            const risks = Array.isArray(fr.key_risks) ? fr.key_risks.slice(0,4) : [];
            // Bull/Bear
            const bull = fr.bull_thesis || '';
            const bear = fr.bear_thesis || '';
            // Execution rules
            const rules = Array.isArray(data.execution_rules) && data.execution_rules.length
                ? data.execution_rules
                : Array.isArray(fr.execution_rules)
                  ? fr.execution_rules
                  : [];

            const formatRule = (rule) => {
                if (typeof rule === 'string') return rule;
                if (!rule || typeof rule !== 'object') return JSON.stringify(rule);
                return [rule.type ? `[${rule.type}]` : '', rule.ticker, rule.trigger_price ? `@ ${rule.trigger_price}` : '', rule.action ? `→ ${rule.action}` : ''].filter(Boolean).join(' ');
            };

            const chartPayload = {
                donut: scData.length
                    ? {
                          labels: scData.map((x) => x.label),
                          values: scData.map((x) => x.pct),
                          colors: scData.map((x) => x.color),
                      }
                    : null,
                hBar: plEntries.length
                    ? {
                          labels: plEntries.map((e) => String(e.k).replace(/_/g, ' ')),
                          values: plEntries.map((e) => e.n),
                          colors: plEntries.map((e) => e.color),
                      }
                    : null,
            };
            const chartPayloadEmbed = safeInlineJsonPayload(chartPayload);

            // Build SVG donut (Chart.js hides this when canvases initialize)
            let donutSVG = '';
            if (scData.length > 0) {
                const total = scData.reduce((s,d) => s + d.pct, 0) || 100;
                const cx = 110, cy = 110, R = 88, r = 56;
                let ang = -Math.PI / 2;
                const paths = scData.map(sc => {
                    const sweep = (sc.pct / total) * 2 * Math.PI;
                    const ea = ang + sweep;
                    const x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
                    const x2 = cx + R * Math.cos(ea), y2 = cy + R * Math.sin(ea);
                    const ix1 = cx + r * Math.cos(ea), iy1 = cy + r * Math.sin(ea);
                    const ix2 = cx + r * Math.cos(ang), iy2 = cy + r * Math.sin(ang);
                    const large = sweep > Math.PI ? 1 : 0;
                    const d = `M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R},0,${large},1,${x2.toFixed(1)},${y2.toFixed(1)} L${ix1.toFixed(1)},${iy1.toFixed(1)} A${r},${r},0,${large},0,${ix2.toFixed(1)},${iy2.toFixed(1)} Z`;
                    ang = ea;
                    return `<path d="${d}" fill="${sc.color}" opacity="0.9"/>`;
                });
                const bull0 = scData.find(s => s.label.toLowerCase().includes('bull')) || scData[0];
                donutSVG = `<svg viewBox="0 0 220 220" width="220" height="220">
  ${paths.join('')}
  <circle cx="${cx}" cy="${cy}" r="${r-3}" fill="#0D1117"/>
  <text x="${cx}" y="${cy-10}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="22" font-weight="700" fill="#E6EDF5">${bull0 ? bull0.pct : 0}%</text>
  <text x="${cx}" y="${cy+10}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="0.12em" fill="rgba(255,255,255,0.45)">${esc((bull0 ? bull0.label : '').toUpperCase())}</text>
</svg>`;
            }

            // Build price level bars
            const plBars = plEntries.map(e => {
                const w = plMax > 0 ? Math.round((e.n / plMax) * 100) : 50;
                return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
  <div style="width:110px;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.45);text-align:right;flex-shrink:0">${esc(e.k.replace(/_/g,' '))}</div>
  <div style="flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden">
    <div style="width:${w}%;height:100%;background:${e.color};border-radius:4px"></div>
  </div>
  <div style="width:64px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#E6EDF3;flex-shrink:0">$${e.n.toFixed(2)}</div>
</div>`;
            }).join('');

            const kpiCards = [
                { label: 'TICKER', value: ticker, color: '#00AFFF' },
                { label: 'RATING', value: rating.toUpperCase(), color: accentHex },
                { label: 'PRICE', value: price, color: '#E6EDF3' },
                { label: 'CONFIDENCE', value: confN > 0 ? confN + '%' : '—', color: '#00AFFF' },
            ].map(k => `<div style="flex:1;min-width:140px;padding:20px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(240,246,252,0.12);border-radius:12px">
  <div style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.2em;color:rgba(255,255,255,0.45);margin-bottom:8px">${esc(k.label)}</div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:${k.color};letter-spacing:-0.02em">${esc(k.value)}</div>
</div>`).join('');

            const scLegend = scData.map(sc => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
  <span style="width:10px;height:10px;border-radius:50%;background:${sc.color};flex-shrink:0;display:inline-block"></span>
  <span style="font-size:13px;flex:1;text-transform:capitalize;color:#E6EDF3">${esc(sc.label)}</span>
  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,0.45)">${sc.pct}%</span>
</div>`).join('');

            const riskRows = risks.map(kr => {
                const text = typeof kr === 'string' ? kr : (kr.risk || kr.description || kr.text || '');
                return `<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(240,246,252,0.07)">
  <span style="color:#DA3633;flex-shrink:0;margin-top:1px">▸</span>
  <span style="font-size:13px;color:rgba(230,237,243,0.88);line-height:1.55">${esc(text)}</span>
</div>`;
            }).join('');

            const ruleRows = rules.slice(0,5).map((rule, i) => `<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(240,246,252,0.07);align-items:flex-start">
  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,0.45);flex-shrink:0;min-width:1.2rem">${i+1}.</span>
  <span style="font-size:13px;color:rgba(230,237,243,0.9);line-height:1.55">${esc(formatRule(rule))}</span>
</div>`).join('');

            const card = (title, body, extra = '') => `<div class="ig-card" style="${extra}">
  <div class="ig-card-label">${title}</div>
  ${body}
</div>`;

            const igBarCvH =
                plEntries.length > 0 ? Math.max(200, Math.min(440, plEntries.length * 44 + 100)) : 200;

            const tldr = data.tldr || fr.tldr || fr.primary_recommendation || '';

            return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>R.A. Omega Infographic - ${esc(ticker)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>

.igcat-d{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.45);margin-bottom:6px}

}
</style>
</head>
<body>
<script type="application/json" id="atlasIgPayload">${chartPayloadEmbed}<\/script>
<!-- Header -->
<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid rgba(240,246,252,0.12)">
  <div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.22em;color:#18C6C8;margin-bottom:4px">R.A. OMEGA</div>
    <div style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:#E6EDF3">${esc(fr.company_name || ticker)} <span style="color:rgba(255,255,255,0.45);font-size:18px;font-weight:400">${esc(ticker)}</span></div>
    <div style="font-size:13px;color:rgba(255,255,255,0.45);margin-top:4px;font-family:'JetBrains Mono',monospace">${esc(fr.sector || 'Equity Analysis')} · ${esc(new Date().toLocaleDateString())}</div>

  <button class="no-print" onclick="window.print()" style="font-family:'JetBrains Mono',monospace;font-size:11px;padding:10px 18px;border-radius:10px;border:1px solid rgba(0,68,255,0.42);background:rgba(0,68,255,0.08);color:#00AFFF;cursor:pointer">Export PDF</button>

      `<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;justify-content:center">
    <div class="ig-chart-cell" style="min-width:200px;width:280px">
      <canvas id="igCvScenario" width="560" height="560" style="display:none;width:280px;height:280px;margin:0 auto;image-rendering:crisp-edges" aria-label="Scenario probabilities chart"></canvas>
      <div id="igFbScenario" class="ig-chart-fallback" style="width:100%">${donutSVG}</div>
    </div>
    <div style="flex:1;min-width:120px">${scLegend}</div>

  ${plBars

            `<div class="ig-chart-cell" style="width:100%;padding-top:4px">
    <canvas id="igCvPrices" width="900" height="${igBarCvH * 2}" style="display:none;width:100%;max-width:560px;height:${igBarCvH}px;margin:0 auto" aria-label="Price levels chart"></canvas>
    <div id="igFbPrices">${plBars}</div>

        )
      : ''}
</div>
${catsIgHtml ? card('Catalyst Timeline', `<div class="ig-strip">${catsIgHtml}</div>`) : ''}
<!-- Bull / Bear -->
${(bull || bear) ? `<div class="ig-grid">
  ${bull ? card('Bull Case', `<div style="font-size:13px;color:rgba(230,237,243,0.9);line-height:1.65">${esc(bull)}</div>`, 'border-color:rgba(35,134,54,0.28);background:rgba(35,134,54,0.055)') : ''}
  ${bear ? card('Bear Case', `<div style="font-size:13px;color:rgba(230,237,243,0.9);line-height:1.65">${esc(bear)}</div>`, 'border-color:rgba(218,54,51,0.28);background:rgba(218,54,51,0.055)') : ''}
</div>` : ''}
<!-- Risks + Rules -->
<div class="ig-grid">

<div class="ig-footer" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.45);padding-top:20px;border-top:1px solid rgba(240,246,252,0.08)">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js" crossorigin="anonymous"><\/script>
<script>
(function(){
function atlasIgPayload(){try{var e=document.getElementById('atlasIgPayload');return e?JSON.parse(e.textContent||'{}'):{};}catch(__){return {}}}
function hideEl(el){if(el){el.style.display='none'}}
document.addEventListener('DOMContentLoaded',function(){
if(typeof Chart==='undefined')return;
var P=atlasIgPayload();
var dpr=Math.min(window.devicePixelRatio||1,3);
function sizeCanvas(cv){
var rect=cv.getBoundingClientRect();
if(!rect.width)return;
cv.width=Math.round(rect.width*dpr);

        /** Rebuild POST /query envelope from DB row (result_json is flattened final_report + _parsed_query + _timing). */
        function normalizeStoredReportToEnvelope(queryText, stored) {
            const r = stored && typeof stored === 'object' ? { ...stored } : {};
            if (r.final_report && typeof r.final_report === 'object') {
                return {
                    ...r,
                    query: queryText || r.query || '',
                };
            }
            const pq = r._parsed_query;
            const timing = r._timing;
            const metaKeys = new Set(['_parsed_query', '_timing']);
            const fr = {};
            for (const [k, v] of Object.entries(r)) {
                if (!metaKeys.has(k)) fr[k] = v;
            }
            return {
                query: queryText || '',
                parsed_query: typeof pq === 'object' && pq ? pq : {},
                timing: typeof timing === 'object' && timing ? timing : {},
                final_report: fr,
                tldr: fr.tldr || '',
                trader_memo: fr.trader_memo || '',
                hedge_fund_brief: fr.hedge_fund_brief || '',
                execution_rules: Array.isArray(fr.execution_rules) ? fr.execution_rules : [],
                failure_modes: Array.isArray(fr.failure_modes) ? fr.failure_modes : [],
                scenarios: Array.isArray(fr.scenarios) ? fr.scenarios : [],
                clarification_questions: Array.isArray(fr.clarification_questions) ? fr.clarification_questions : [],
            };
        }

        function formatQueryResponse(data) {
            const fr = data.final_report || {};
            if (isPlainChatResponse(data)) {
                return (
                    data.tldr ||
                    fr.executive_summary ||
                    fr.executive_brief ||
                    data.trader_memo ||
                    fr.trader_memo ||
                    ''
                ).trim();
            }
            const parts = [];
            if (data.tldr || fr.tldr) parts.push(data.tldr || fr.tldr);
            if (data.trader_memo || fr.trader_memo) parts.push('\n' + (data.trader_memo || fr.trader_memo));
            if (fr.executive_summary) parts.push('\n' + fr.executive_summary);
            else if (fr.headline && fr.executive_brief) parts.push('\n' + fr.headline + '\n\n' + fr.executive_brief);
            const body = parts.join('').trim();
            return body || JSON.stringify({ error: fr.error || 'empty', keys: Object.keys(data) }).slice(0, 3500);
        }

        function isPlainChatResponse(data) {
            if (!data || typeof data !== 'object') return false;
            const pq = data.parsed_query && typeof data.parsed_query === 'object' ? data.parsed_query : {};
            const timing = data.timing && typeof data.timing === 'object' ? data.timing : {};
            const loops = Number(timing.loops);
            return (
                pq._chat_mode === true ||
                timing._chat_mode === true ||
                pq.intent_route === 'CONVERSATION' ||
                pq.query_type === 'CONVERSATION' ||
                loops === 0
            );
        }

        function hasStructuredFinanceSections(data) {
            if (!data || typeof data !== 'object') return false;
            const fr = data.final_report && typeof data.final_report === 'object' ? data.final_report : {};
            const pq = data.parsed_query && typeof data.parsed_query === 'object' ? data.parsed_query : {};
            const route = String((data._route_decision && data._route_decision.route_band) || '').toLowerCase();
            const agentIds =
                data._active_agents && Array.isArray(data._active_agents.agent_ids)
                    ? data._active_agents.agent_ids
                    : [];
            const structuredKeys = [
                'ticker',
                'overall_rating',
                'primary_recommendation',
                'trade_plan',
                'price_levels',
                'catalysts_timeline',
                'key_risks',

            const qt = String(pq.query_type || pq.intent_route || '').toUpperCase();

        const App = () => {
            const inFlightRef = useRef(new Set());
            const progressTimersRef = useRef({});
            const hydrateSeqRef = useRef({});

            const [inputValue, setInputValue] = useState('');
            const scrollRef = useRef(null);

            const [logsBySession, setLogsBySession] = useState({});
            const [loopStepBySession, setLoopStepBySession] = useState({});
            const [lastTotalsBySession, setLastTotalsBySession] = useState({});
            const [processingBySession, setProcessingBySession] = useState({});
            const [researchActivityBySession, setResearchActivityBySession] = useState({});

            const [sessions, setSessions] = useState([]);
            const [activeSessionId, setActiveSessionId] = useState(() => {
                try { return localStorage.getItem('atlas_active_session_id') || null; } catch { return null; }
            });
            const [sessionsLoading, setSessionsLoading] = useState(false);
            const [sessionsUnavailable, setSessionsUnavailable] = useState(false);
            const [sessionsError, setSessionsError] = useState('');
            const [regimeState, setRegimeState] = useState({ loading: true, label: '', signal: '' });
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [prefsTick, setPrefsTick] = useState(0);
            const [toolsOpen, setToolsOpen] = useState(false);
            const [researchMode, setResearchMode] = useState(() => {
                try { return localStorage.getItem('atlas_default_research_mode') || 'normal'; } catch { return 'normal'; }
            });
            const [mobileSessionsOpen, setMobileSessionsOpen] = useState(false);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

            const voiceRecorderRef = useRef(null);
            const voiceChunksRef = useRef([]);
            const voiceStreamRef = useRef(null);
            const voiceUserLogIdRef = useRef(null);
            /** Session active when mic started — voice upload always uses this sid (survives switching chats while recording). */
            const voiceRecordSessionRef = useRef(null);
            const [voiceRecording, setVoiceRecording] = useState(false);
            const [voiceBusy, setVoiceBusy] = useState(false);

            useEffect(() => {
                const token =
                    localStorage.getItem('atlas_access_token') || localStorage.getItem('ATLAS_TEST_JWT');
                if (!token || !String(token).trim()) {
                    const localDevHost = ['127.0.0.1', 'localhost'].includes(window.location.hostname);
                    if (localDevHost) {
                        localStorage.setItem('ATLAS_TEST_JWT', 'local-dev-token');
                        return;
                    }
                    window.location.href = '/auth';
                    return;
                }
            }, []);

            useEffect(() => {
                const openSettings = () => setSettingsOpen(true);
                window.addEventListener('atlas-open-settings', openSettings);
                return () => window.removeEventListener('atlas-open-settings', openSettings);
            }, []);

            const loadSessions = useCallback(async () => {
                setSessionsLoading(true);
                setSessionsError('');
                try {
                    const r = await fetch(apiBase() + '/sessions', {
                        headers: authHeaders(),
                        signal: AbortSignal.timeout(10000),
                    });
                    if (r.status === 503) {
                        setSessionsUnavailable(true);
                        setSessions([]);
                    } else {
                        setSessionsUnavailable(false);
                    }
                    if (r.ok) {
                        const d = await r.json();
                        setSessions(Array.isArray(d.sessions) ? d.sessions : []);
                    } else if (r.status !== 503) {
                        setSessionsError('Could not load chats. Check the API session endpoint and try again.');
                    }
                } catch (_) {
                    setSessionsError('Could not reach the sessions API. Is the server still running?');
                }
                setSessionsLoading(false);
            }, []);

            const createSessionWithTitle = useCallback(async (title) => {
                try {
                    const r = await fetch(apiBase() + '/sessions', {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify({ title: (title || 'New chat').slice(0, 120) }),
                        signal: AbortSignal.timeout(15000),
                    });
                    if (!r.ok) return null;
                    const d = await r.json();
                    return d.session && d.session.id ? String(d.session.id) : null;
                } catch (_) {
                    return null;
                }
            }, []);

            const tsFromReport = (iso) => {
                try {
                    const d = iso ? new Date(iso) : new Date();
                    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                } catch (_) {
                    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                }
            };

            const loadSessionHistory = useCallback(async (sessionId) => {
                if (!sessionId) return [];
                try {
                    const r = await fetch(
                        apiBase() + '/history/reports?session_id=' + encodeURIComponent(String(sessionId)),
                        {
                            headers: authHeaders(),
                            signal: AbortSignal.timeout(45000),
                        }
                    );
                    if (!r.ok) return [];
                    const d = await r.json();
                    const reps = Array.isArray(d.reports) ? d.reports : [];
                    return [...reps].reverse();
                } catch (_) {
                    return [];
                }
            }, []);

            const applyHistoryReports = useCallback((sessionId, reportsAsc) => {
                const sid = String(sessionId);
                const next = [];
                let nid = Date.now();
                for (const rep of reportsAsc) {
                    const q = (rep && rep.query) || '';
                    const env = normalizeStoredReportToEnvelope(q, rep && rep.result);
                    next.push({
                        id: nid++,
                        sender: 'USR',
                        type: 'user',
                        timestamp: tsFromReport(rep.ts),
                        content: q,
                    });
                    const agentLog = logFromQueryResponse(env);
                    next.push({
                        id: nid++,
                        sender: 'ATLAS',
                        type: 'agent',
                        timestamp: tsFromReport(rep.ts),
                        ...agentLog,
                    });
                }
                setLogsBySession((prev) => ({ ...prev, [sid]: next }));
            }, []);

            useEffect(() => {
                let cancelled = false;
                const ts = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

                if (!activeSessionId) {
                    return () => { cancelled = true; };
                }

                const sid = String(activeSessionId);
                if (inFlightRef.current.has(sid)) {
                    return () => { cancelled = true; };
                }

                const myGen = (hydrateSeqRef.current[sid] = (hydrateSeqRef.current[sid] || 0) + 1);

                setLogsBySession((prev) => {
                    const cur = prev[sid];
                    if (hasRealChatMessages(cur)) return prev;
                    return {
                        ...prev,
                        [sid]: [{ id: Date.now(), sender: 'ATLAS', type: 'system', timestamp: ts(), content: 'Loading…' }],
                    };
                });

                (async () => {
                    const reps = await loadSessionHistory(sid);
                    if (cancelled || hydrateSeqRef.current[sid] !== myGen) return;
                    if (inFlightRef.current.has(sid)) return;
                    if (reps.length) {
                        applyHistoryReports(sid, reps);
                    } else {
                        setLogsBySession((prev) => {
                            if (hydrateSeqRef.current[sid] !== myGen) return prev;
                            const cur = prev[sid];
                            if (hasRealChatMessages(cur)) return prev;
                            return {
                                ...prev,
                                [sid]: [
                                    {
                                        id: Date.now(),
                                        sender: 'ATLAS',
                                        type: 'system',
                                        timestamp: ts(),
                                        content: 'New chat - ask about a ticker, portfolio risk, options, debt, credit repair, business structure, taxes, real estate, or macro conditions.',
                                    },
                                ],
                            };
                        });
                    }
                })();

                return () => { cancelled = true; };
            }, [activeSessionId, loadSessionHistory, applyHistoryReports]);

            const createNewChat = async () => {
                const newId = await createSessionWithTitle('New chat');
                if (newId) {
                    try {
                        localStorage.setItem('atlas_active_session_id', newId);
                    } catch (_) {}
                    hydrateSeqRef.current[newId] = (hydrateSeqRef.current[newId] || 0) + 1;
                    setActiveSessionId(newId);
                }
                await loadSessions();
                setMobileSessionsOpen(false);
            };

            const selectSession = (id) => {
                try { localStorage.setItem('atlas_active_session_id', String(id)); } catch (_) {}
                setActiveSessionId(String(id));
                setMobileSessionsOpen(false);
            };

            const renameSession = async (id) => {
                const cur = sessions.find((s) => String(s.id) === String(id));
                const t = prompt('Chat name', cur?.title || 'Chat');
                if (t == null) return;
                try {
                    const r = await fetch(apiBase() + '/sessions/' + encodeURIComponent(id), {
                        method: 'PATCH',
                        headers: authHeaders(),
                        body: JSON.stringify({ title: (t || '').trim() || 'Chat' }),
                        signal: AbortSignal.timeout(15000),
                    });
                    if (r.ok) await loadSessions();
                } catch (_) {}
            };

            const archiveSession = async (id) => {
                if (!confirm('Archive this chat? It will be hidden from this list (not deleted).')) return;
                try {
                    const r = await fetch(apiBase() + '/sessions/' + encodeURIComponent(id), {
                        method: 'PATCH',
                        headers: authHeaders(),
                        body: JSON.stringify({ archived: true }),
                        signal: AbortSignal.timeout(15000),
                    });
                    if (r.ok) {
                        if (activeSessionId === String(id)) {
                            setActiveSessionId(null);
                            try { localStorage.removeItem('atlas_active_session_id'); } catch (_) {}
                        }
                        await loadSessions();
                    }
                } catch (_) {}
            };

            const deleteSession = async (id) => {
                if (!confirm('Delete this chat? Saved reports stay in history.')) return;
                try {
                    const r = await fetch(apiBase() + '/sessions/' + encodeURIComponent(id), {
                        method: 'DELETE',
                        headers: authHeaders(),
                        signal: AbortSignal.timeout(15000),
                    });
                    if (r.ok) {
                        if (activeSessionId === String(id)) {
                            setActiveSessionId(null);
                            try { localStorage.removeItem('atlas_active_session_id'); } catch (_) {}
                        }
                        setLogsBySession((prev) => {
                            const n = { ...prev };
                            delete n[String(id)];
                            return n;
                        });
                        setLastTotalsBySession((prev) => {
                            const n = { ...prev };
                            delete n[String(id)];
                            return n;
                        });
                        setResearchActivityBySession((prev) => {
                            const n = { ...prev };
                            delete n[String(id)];
                            return n;
                        });
                        await loadSessions();
                    }
                } catch (_) {}
            };

            const logs = useMemo(() => {
                const ts = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

                    nick = (localStorage.getItem('atlas_display_name') || '').trim();

                    const welcome = nick
                        ? `Hi ${nick} — type a message below to start a new chat (a session is created automatically). You can also pick a chat in the sidebar.`

                            sender: 'ATLAS',
                            type: 'system',
                            timestamp: ts(),
                            content: welcome,

                    try {
                        const r = await fetch(apiBase() + '/regime', { signal: AbortSignal.timeout(20000) });
                        const d = r.ok ? await r.json() : {};
                        if (cancelled) return;
                        const raw = ((d && d.regime) || 'UNKNOWN').toString();
                        const label = raw.replace(/_/g, ' ').trim() || 'UNKNOWN';
                        setRegimeState({
                            loading: false,
                            label,
                            signal: typeof d.signal === 'string' ? d.signal : '',
                        });
                    } catch (_) {
                        if (!cancelled) setRegimeState({ loading: false, label: '—', signal: '' });
                    }
                })();
                return () => {
                    cancelled = true;
                };
            }, []);

            const startProgressTick = (sessionId) => {
                const sid = String(sessionId);
                if (progressTimersRef.current[sid]) clearInterval(progressTimersRef.current[sid]);
                setLoopStepBySession((prev) => ({ ...prev, [sid]: 0 }));
                progressTimersRef.current[sid] = setInterval(() => {
                    setLoopStepBySession((prev) => ({
                        ...prev,
                        [sid]: Math.min((prev[sid] ?? 0) + 1, LOOP_STEPS.length - 1),
                    }));
                }, 10000);
            };

            const stopProgressTick = (sessionId) => {
                const sid = String(sessionId);
                const t = progressTimersRef.current[sid];
                if (t) {
                    clearInterval(t);
                    delete progressTimersRef.current[sid];
                }
            };

            const setSessionProcessing = (sid, on) => {
                const k = String(sid);
                setProcessingBySession((prev) => {
                    const n = { ...prev };
                    if (on) n[k] = true;
                    else delete n[k];
                    return n;
                });

            const sendVoiceBlob = useCallback(

                        setActiveSessionId(sid);

                    inFlightRef.current.add(sid);

                    try {
