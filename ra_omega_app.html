                        if (nick) form.append('user_display_name', nick);
                        const answerStyle = (localStorage.getItem('atlas_answer_style') || '').trim();
                        const riskProfile = (localStorage.getItem('atlas_risk_profile') || '').trim();
                        const marketFocus = (localStorage.getItem('atlas_market_focus') || '').trim();
                        const reportDepth = (localStorage.getItem('atlas_report_depth') || '').trim();
                        const citationPreference = (localStorage.getItem('atlas_citation_preference') || '').trim();
                        const complianceLevel = (localStorage.getItem('atlas_compliance_level') || '').trim();
                        if (answerStyle) form.append('answer_style', answerStyle);
                        if (riskProfile) form.append('risk_profile', riskProfile);
                        if (marketFocus) form.append('market_focus', marketFocus);
                        if (reportDepth) form.append('report_depth', reportDepth);
                        if (citationPreference) form.append('citation_preference', citationPreference);
                        if (complianceLevel) form.append('compliance_level', complianceLevel);
                    } catch (_) {}

                    try {
                        const r = await fetch(apiBase() + '/voice/query', {
                            method: 'POST',
                            headers: authHeadersMultipart(),
                            body: form,
                            signal: AbortSignal.timeout(queryFetchTimeoutMs()),
                        });
                        const data = await r.json().catch(() => ({}));
                        stopProgressTick(sid);
                        setLoopStepBySession((prev) => ({ ...prev, [sid]: LOOP_STEPS.length - 1 }));

                        const tx = typeof data._voice_transcript === 'string' ? data._voice_transcript : '';

                        if (!r.ok) {
                            const detail = data.detail || data.message || JSON.stringify(data);
                            setLogsBySession((prev) => {
                                const arr = [...(prev[sid] || [])];
                                const ix = arr.findIndex((m) => m.id === uid);
                                if (ix >= 0) {
                                    arr[ix] = {
                                        ...arr[ix],
                                        content: tx || '🎤 Voice message',
                                        voicePending: false,
                                    };
                                }
                                return {
                                    ...prev,
                                    [sid]: [
                                        ...arr,
                                        {
                                            id: Date.now() + 1,
                                            sender: 'ATLAS',
                                            type: 'agent',
                                            timestamp: ts(),
                                            content:
                                                'Request failed (' +
                                                r.status +
                                                '): ' +
                                                (typeof detail === 'string' ? detail : JSON.stringify(detail)),
                                        },
                                    ],
                                };
                            });
                            return;
                        }

                        const timing = data.timing || {};
                        const lines = Object.entries(timing)
                            .filter(([k]) => k !== 'total')
                            .map(([k, v]) => ({
                                k: k.replace(/_/g, ' '),
                                v: typeof v === 'number' ? v + 's' : String(v),
                            }))
                            .slice(0, 16);
                    const src = countDataSources(data.loop_outputs);
                    if (data && data._research_activity) {
                        setResearchActivityBySession((prev) => ({
                            ...prev,
                            [sid]: data._research_activity,
                        }));
                    }
                    setLastTotalsBySession((prev) => ({
                        ...prev,
                        [sid]: {
                                sources: src != null ? String(src) : '—',
                                costStr: estimateGeminiUsd(timing),
                                totalS: timing.total != null ? String(timing.total) + 's' : '—',
                                timingLines: lines,
                            },
                        }));

                        const qHist = tx.trim();
                        const reps = await loadSessionHistory(sid);
                        const lastRep = reps.length ? reps[reps.length - 1] : null;
                        const lastQ = lastRep && lastRep.query != null ? String(lastRep.query).trim() : '';
                        if (reps.length && lastQ === qHist) {
                            applyHistoryReports(sid, reps);
                        } else {
                            setLogsBySession((prev) => {
                                const arr = [...(prev[sid] || [])];
                                const ix = arr.findIndex((m) => m.id === uid);
                                if (ix >= 0) {
                                    arr[ix] = {
                                        ...arr[ix],
                                        content: tx || '🎤 Voice message',
                                        voicePending: false,
                                    };
                                }
                                return {
                                    ...prev,
                                    [sid]: [
                                        ...arr,
                                        {
                                            id: Date.now() + 2,
                                            sender: 'ATLAS',
                                            type: 'agent',
                                            timestamp: ts(),
                                            ...logFromQueryResponse(data),
                                        },
                                    ],
                                };
                            });
                        }
                        loadSessions();
                    } catch (err) {
                        stopProgressTick(sid);
                        let detail = err && err.message ? err.message : String(err);
                        if (/timed out|aborted/i.test(detail)) {
                            detail +=
                                ' - The Omega run can take several minutes. This page now waits up to ' +
                                Math.round(queryFetchTimeoutMs() / 60000) +
                                ' min (set localStorage atlas_query_timeout_ms for longer).';
                        }
                        setLogsBySession((prev) => ({
                            ...prev,
                            [sid]: [
                                ...(prev[sid] || []),
                                {
                                    id: Date.now() + 3,
                                    sender: 'ATLAS',
                                    type: 'agent',
                                    timestamp: ts(),
                                    content: 'Network or timeout: ' + detail,
                                },
                            ],
                        }));
                    } finally {
                        inFlightRef.current.delete(sid);
                        setSessionProcessing(sid, false);
                        setVoiceBusy(false);
                    }
                },
                [
                    activeSessionId,
                    processingBySession,
                    createSessionWithTitle,
                    loadSessions,
                    startProgressTick,
                    stopProgressTick,
                    loadSessionHistory,
                    applyHistoryReports,
                    researchMode,
                ]
            );

            const onVoiceToggle = useCallback(async () => {
                if (voiceBusy && !voiceRecording) return;
                if (voiceRecording) {
                    const mr = voiceRecorderRef.current;
                    if (mr && mr.state !== 'inactive') {
                        setVoiceRecording(false);
                        mr.stop();
                    }
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    voiceStreamRef.current = stream;
                    voiceChunksRef.current = [];
                    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                        ? 'audio/webm;codecs=opus'
                        : MediaRecorder.isTypeSupported('audio/webm')
                          ? 'audio/webm'
                          : '';
                    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
                    voiceRecorderRef.current = mr;
                    mr.ondataavailable = (e) => {
                        if (e.data && e.data.size) voiceChunksRef.current.push(e.data);
                    };
                    mr.onstop = () => {
                        stopVoiceStreams();
                        voiceRecorderRef.current = null;
                        const chunks = voiceChunksRef.current;
                        voiceChunksRef.current = [];
                        const blob = new Blob(chunks, { type: mime || 'audio/webm' });
                        if (!blob.size) {
                            voiceRecordSessionRef.current = null;
                            setVoiceBusy(false);
                            return;
                        }
                        void sendVoiceBlob(blob);
                    };
                    voiceRecordSessionRef.current = activeSessionId ? String(activeSessionId) : null;
                    mr.start(200);
                    setVoiceRecording(true);
                } catch (e) {
                    voiceRecordSessionRef.current = null;
                    alert('Microphone access denied or unavailable: ' + (e && e.message ? e.message : String(e)));
                    stopVoiceStreams();
                    setVoiceRecording(false);
                }
            }, [voiceBusy, voiceRecording, activeSessionId, sendVoiceBlob, stopVoiceStreams]);

            const handleCommand = async (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;

                const q = inputValue.trim();

                let sid = activeSessionId ? String(activeSessionId) : null;
                if (!sid) {
                    const title = q.length > 56 ? q.slice(0, 53) + '…' : q;
                    sid = await createSessionWithTitle(title);
                    if (!sid) {
                        alert(
                            'Could not start a chat. Ensure the Sessions API is enabled (Supabase migration) and you are signed in.'
                        );
                        return;
                    }
                    try {
                        localStorage.setItem('atlas_active_session_id', sid);
                    } catch (_) {}
                    hydrateSeqRef.current[sid] = (hydrateSeqRef.current[sid] || 0) + 1;
                    setActiveSessionId(sid);
                    await loadSessions();
                }

                if (processingBySession[sid]) return;

                const newLog = {
                    id: Date.now(),
                    sender: 'USR',
                    type: 'user',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }),
                    content: q,
                };
                inFlightRef.current.add(sid);
                hydrateSeqRef.current[sid] = (hydrateSeqRef.current[sid] || 0) + 1;
                setSessionProcessing(sid, true);
                setLogsBySession((prev) => ({
                    ...prev,
                    [sid]: [...(prev[sid] || []), newLog],
                }));
                setInputValue('');
                startProgressTick(sid);

                setToolsOpen(false);
                const activeMode = researchMode || 'normal';
                let plannedJobId = null;
                if (activeMode === 'deep' || activeMode === 'web') {
                    let plannedActivity = buildPendingResearchActivity(q, activeMode);
                    try {
                        const planResp = await fetch(apiBase() + '/jobs/plan', {
                            method: 'POST',
                            headers: authHeaders(),
                            body: JSON.stringify({
                                query: q,
                                session_id: sid,
                                research_mode: activeMode,
                                web_search: activeMode === 'web' || activeMode === 'deep',
                            }),
                            signal: AbortSignal.timeout(12000),
                        });
                        const planData = await planResp.json().catch(() => ({}));
                        if (planResp.ok && planData.activity) {
                            plannedActivity = planData.activity;
                            plannedJobId = planData.activity.job_id || planData.job?.job_id || null;
                        }
                    } catch (_) {}
                    setResearchActivityBySession((prev) => ({ ...prev, [sid]: plannedActivity }));
                }
                const queryBody = {
                    query: q,
                    session_id: sid,
                    research_mode: activeMode,
                    web_search: activeMode === 'web' || activeMode === 'deep',
                };
                if (plannedJobId) queryBody.research_job_id = plannedJobId;
                try {
                    const nick = (localStorage.getItem('atlas_display_name') || '').trim();
                    if (nick) queryBody.user_display_name = nick;
                    const answerStyle = (localStorage.getItem('atlas_answer_style') || '').trim();
                    const riskProfile = (localStorage.getItem('atlas_risk_profile') || '').trim();
                    const marketFocus = (localStorage.getItem('atlas_market_focus') || '').trim();
                    const reportDepth = (localStorage.getItem('atlas_report_depth') || '').trim();
                    const citationPreference = (localStorage.getItem('atlas_citation_preference') || '').trim();
                    const complianceLevel = (localStorage.getItem('atlas_compliance_level') || '').trim();
                    if (answerStyle) queryBody.answer_style = answerStyle;
                    if (riskProfile) queryBody.risk_profile = riskProfile;
                    if (marketFocus) queryBody.market_focus = marketFocus;
                    if (reportDepth) queryBody.report_depth = reportDepth;
                    if (citationPreference) queryBody.citation_preference = citationPreference;
                    if (complianceLevel) queryBody.compliance_level = complianceLevel;
                } catch (_) {}

                try {
                    const r = await fetch(apiBase() + '/query', {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify(queryBody),
                        signal: AbortSignal.timeout(queryFetchTimeoutMs()),
                    });
                    const data = await r.json().catch(() => ({}));
                    stopProgressTick(sid);
                    setLoopStepBySession((prev) => ({ ...prev, [sid]: LOOP_STEPS.length - 1 }));

                    if (!r.ok) {
                        const detail = data.detail || data.message || JSON.stringify(data);
                        setLogsBySession((prev) => ({
                            ...prev,
                            [sid]: [
                                ...(prev[sid] || []),
                                {
                                    id: Date.now() + 1,
                                    sender: 'ATLAS',
                                    type: 'agent',
                                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }),
                                    content:
                                        'Request failed (' +
                                        r.status +
                                        '): ' +
                                        (typeof detail === 'string' ? detail : JSON.stringify(detail)),
                                },
                            ],
                        }));
                        return;
                    }

                    const timing = data.timing || {};
                    const lines = Object.entries(timing)
                        .filter(([k]) => k !== 'total')
                        .map(([k, v]) => ({
                            k: k.replace(/_/g, ' '),
                            v: typeof v === 'number' ? v + 's' : String(v),
                        }))
                        .slice(0, 16);
                    const src = countDataSources(data.loop_outputs);
                    if (data && data._research_activity) {
                        setResearchActivityBySession((prev) => ({
                            ...prev,
                            [sid]: data._research_activity,

                    }
                    setLastTotalsBySession((prev) => ({

                        [sid]: {
                            sources: src != null ? String(src) : '—',

                            totalS: timing.total != null ? String(timing.total) + 's' : '—',
                            timingLines: lines,

                    const reps = await loadSessionHistory(sid);
                    const lastRep = reps.length ? reps[reps.length - 1] : null;
                    const lastQ = lastRep && lastRep.query != null ? String(lastRep.query).trim() : '';
                    if (reps.length && lastQ === q.trim()) {
                        applyHistoryReports(sid, reps);
                    } else {
                        setLogsBySession((prev) => ({

                                ...(prev[sid] || []),

                                    id: Date.now() + 2,

                    loadSessions();

                    if (/timed out|aborted/i.test(detail)) {
                        detail +=
                            ' - The Omega run can take several minutes. This page now waits up to ' +
                            Math.round(queryFetchTimeoutMs() / 60000) +
                            ' min (set localStorage atlas_query_timeout_ms for longer).';
                    }
                    setLogsBySession((prev) => ({
                        ...prev,
                        [sid]: [

                            {
                                id: Date.now() + 3,
                                sender: 'ATLAS',
                                type: 'agent',
                                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }),
                                content: 'Network or timeout: ' + detail,

                    inFlightRef.current.delete(sid);
                    setSessionProcessing(sid, false);

            const lastTotals = activeSessionId
                ? lastTotalsBySession[String(activeSessionId)] || {
                      sources: null,
                      costStr: '~$0.008',
                      totalS: null,
                      timingLines: [],
                  }
                : { sources: null, costStr: '~$0.008', totalS: null, timingLines: [] };

            const activeIsProcessing = activeSessionId && processingBySession[String(activeSessionId)];
            const loopStepIdx = activeSessionId ? loopStepBySession[String(activeSessionId)] ?? 0 : 0;

            const liveLoopLine = LOOP_STEPS[loopStepIdx] || LOOP_STEPS[0];
            const liveSources =
                activeIsProcessing ? String(Math.min(8, 6 + Math.min(loopStepIdx, 3))) : lastTotals.sources || '—';
            const liveCost = activeIsProcessing ? '~$0.008 (est.)' : lastTotals.costStr;

            const lastResearchMeta = useMemo(() => {
                const real = [...logs].reverse().find((m) => m && m.rawData && shouldRenderStructuredResponse(m.rawData));
                const raw = real && real.rawData ? real.rawData : null;
                const pending = activeSessionId ? researchActivityBySession[String(activeSessionId)] : null;
                return {
                    activity: pending || (raw && raw._research_activity ? raw._research_activity : null),
                    decision: raw && raw._route_decision ? raw._route_decision : null,
                };
            }, [logs, activeSessionId, researchActivityBySession]);

            const activeSession = sessions.find((s) => String(s.id) === String(activeSessionId));
            const headerChatTitle = activeSession?.title || (activeSessionId ? 'Chat' : 'New chat');
            const headerTopicBadge = activeSession?.context_topic || (activeSessionId ? 'Active' : 'Message to start');
            const voiceDictationEnabled = (() => {
                try { return localStorage.getItem('atlas_voice_dictation') !== 'false'; } catch (_) { return true; }
            })();

            const otherProcessingIds = Object.keys(processingBySession).filter(
                (k) => processingBySession[k] && String(k) !== String(activeSessionId || '')
            );
            const otherProcessingFirst =
                otherProcessingIds.length === 1
                    ? sessions.find((s) => String(s.id) === otherProcessingIds[0])
                    : null;
            const bgLoopStepIdx =
                otherProcessingIds.length === 1 ? loopStepBySession[otherProcessingIds[0]] ?? 0 : 0;
            const bgLiveLoopLine = LOOP_STEPS[bgLoopStepIdx] || LOOP_STEPS[0];

            const cancelResearchJob = useCallback(async (jobId) => {
                const sid = activeSessionId ? String(activeSessionId) : null;
                if (!jobId || !sid) return;
                try {
                    const r = await fetch(apiBase() + '/jobs/' + encodeURIComponent(jobId) + '/cancel', {
                        method: 'POST',
                        headers: authHeaders(),
                        signal: AbortSignal.timeout(10000),
                    });
                    const d = await r.json().catch(() => ({}));
                    if (r.ok && d.activity) {
                        setResearchActivityBySession((prev) => ({ ...prev, [sid]: d.activity }));
                    }
                } catch (_) {}
            }, [activeSessionId]);

            useEffect(() => {
                const sid = activeSessionId ? String(activeSessionId) : null;
                if (!sid || !processingBySession[sid]) return;
                const activity = researchActivityBySession[sid];
                const jobId = activity && activity.job_id;
                if (!jobId || !['queued', 'in_progress'].includes(String(activity.status || ''))) return;
                let cancelled = false;
                const poll = async () => {
                    try {
                        const r = await fetch(apiBase() + '/jobs/' + encodeURIComponent(jobId), {
                            headers: authHeaders(),
                            signal: AbortSignal.timeout(8000),
                        });
                        if (!r.ok) return;
                        const d = await r.json();
                        if (!cancelled && d.activity) {
                            setResearchActivityBySession((prev) => ({ ...prev, [sid]: d.activity }));
                        }
                    } catch (_) {}
                };
                void poll();
                const id = setInterval(poll, 2000);
                return () => {
                    cancelled = true;
                    clearInterval(id);

                                            </div>
                                        ))}
                                        <div className="flex justify-between pt-1 border-t border-borderSubtle text-textMain">
                                            <span>total</span>
                                            <span>{lastTotals.totalS}</span>
                                        </div>
                                    </div>
                                )}
                                {!activeIsProcessing && otherProcessingIds.length > 0 && (
                                    <div className="mt-3 rounded-lg border border-amber-500/35 bg-amber-500/10 px-2.5 py-2 text-[10px] font-mono text-amber-100/95 leading-snug">
                                        <div className="font-semibold text-amber-200/95">Query running in another chat</div>
                                        <div className="mt-1 text-textMuted">{bgLiveLoopLine}</div>
                                        {otherProcessingFirst ? (
                                            <button
                                                type="button"
                                                onClick={() => selectSession(otherProcessingFirst.id)}
                                                className="mt-2 w-full text-left rounded border border-accent-indigo/40 bg-accent-indigo/10 px-2 py-1.5 text-accent-indigo hover:bg-accent-indigo/20 transition-colors"
                                            >
                                                Open: {otherProcessingFirst.title || 'Chat'}
                                            </button>
                                        ) : otherProcessingIds.length > 1 ? (
                                            <div className="mt-1.5 text-textMuted">
                                                {otherProcessingIds.length} threads busy — switch in the sidebar.
                                            </div>
                                        ) : (
                                            <div className="mt-1.5 text-textMuted">Open that chat from the sidebar.</div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div>
                                <h3 className="text-xs font-semibold text-textMain mb-3 flex items-center gap-2">
                                    <Icon name="Cpu" size={14} className="text-textMuted" /> Telemetry
                                </h3>
                                <div className="space-y-3 font-mono text-xs">
                                    <div className="flex justify-between items-center">
                                        <span className="text-textMuted">Data sources</span>
                                        <span className="text-textMain">{liveSources}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-textMuted">Est. AI cost</span>
                                        <span className="text-textMain">{liveCost}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-textMuted">Wall time</span>
                                        <span className="text-textMain">{activeIsProcessing ? '…' : lastTotals.totalS || '—'}</span>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h3 className="text-xs font-semibold text-textMain mb-3 flex items-center gap-2">
                                    <Icon name="Database" size={14} className="text-textMuted" /> Data feeds
                                </h3>
                                <div className="space-y-2">
                                    {['Market and macro context', 'Filings, news, and anomaly checks', 'Omega synthesis', 'Risk rules and export packaging'].map((name) => (
                                        <div key={name} className="p-2 rounded border border-borderSubtle bg-surfaceHover flex items-center gap-3">
                                            <div
                                                className={`w-2 h-2 rounded-full shrink-0 ${
                                                    activeIsProcessing ? 'bg-amber-400 animate-pulse' : lastTotals.timingLines.length ? 'bg-accent-emerald' : 'bg-textMuted/40'
                                                }`}
                                            />
                                            <span className="text-sm text-textMain">{name}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </aside>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
